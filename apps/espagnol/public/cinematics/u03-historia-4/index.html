    <script>

        });

        // ---------- Abuela Carmen devant la fresque ----------
        var abu = S.chr(room.actors, "abuela_carmen", 900, 1070, 400);
        S.breathe(tl, abu, 0, T, 0.9);
        Q.charBlink(tl, abu.svg, 1.9); Q.charBlink(tl, abu.svg, 5.0); Q.charBlink(tl, abu.svg, 7.4);
        C.talkBounce(tl, abu.b, L1, 5); C.talkChar(tl, abu, L1);
        var wMira = C.wordT(PLAN, 3, 1, 1), wNom = C.wordT(PLAN, 3, 1, 9);

        tl.to(aR, { rotation: -105, svgOrigin: "258 306", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, wMira + 0.5);
        tl.to(aR, { rotation: -140, svgOrigin: "258 306", duration: 0.3, ease: "power2.out" }, wNom - 0.1);
        tl.to(aL, { rotation: 60, svgOrigin: "142 306", duration: 0.3, ease: "back.out(1.7)" }, wNom - 0.1);       // les deux bras en l'air : « ¡no estan! »
        tl.to([aR, aL], { rotation: 0, duration: 0.5, ease: "power2.inOut" }, L1.t + L1.d + 0.1);
        Q.charEmote(tl, abu.svg, wNom - 0.2, "worry", 0.3);

        tl.fromTo(sm, { opacity: 0, scale: 0.6 }, { opacity: 0.9, scale: 1, duration: 0.7, ease: "power2.out", immediateRender: false }, tS);
        tl.fromTo(sb, { x: 1140, y: 280, opacity: 0, scale: 0.4 }, { x: 1640, y: 250, opacity: 1, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, tS);

        for (var k = 0; k < 16; k++) {
          var d = S.mk(room.actors, "dot"); d.setAttribute("data-layout-allow-overflow", "");
          var ang = (k / 16) * 6.283, x0 = 1200 + Math.cos(ang) * 40, y0 = 420 + Math.sin(ang) * 40;
          tl.fromTo(d, { x: x0, y: y0, scale: 0.3, opacity: 0.9 }, { x: x0 + Math.cos(ang) * (200 + (k % 4) * 50), y: y0 + Math.sin(ang) * (150 + (k % 3) * 40) - 60, scale: 1.3, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, tS + 0.05 + k * 0.015);

      })();
