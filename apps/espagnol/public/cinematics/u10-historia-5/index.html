    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };

        var room = S.set($("#stage"), set, { below: "#4F3F30", motes: 16 });
        S.drift(tl, room, T);
        var dot = set.dot;

        // ---------- la brume derive lentement ; le point vert de Machu Picchu respire (halo doux, cycle 1,6 s) ----------
        room.back.querySelectorAll(".cu-mist").forEach(function (m, i) { tl.fromTo(m, { x: 0 }, { x: (i % 2 ? -1 : 1) * (90 + i * 25), duration: T, ease: "sine.inOut" }, 0); });
        var glow = room.back.querySelector(".cu-dotglow"), dt = room.back.querySelector(".cu-dot");
        gsap.set([glow, dt], { opacity: 0 });
        tl.fromTo([glow, dt], { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "sine.inOut", immediateRender: false }, 0.5);
        tl.fromTo(glow, { scale: 0.85, svgOrigin: dot.x + " " + dot.y }, { scale: 1.2, svgOrigin: dot.x + " " + dot.y, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: C.reps(T, 1.6) + 1 }, 0.5);

        // ---------- le groupe sur la terrasse de pierre, face aux montagnes ----------
        var kil = S.chr(room.actors, "killa", 720, 1050, 330), mar = S.chr(room.actors, "marina", 900, 1056, 322), ale = S.chr(room.actors, "viajero", 1080, 1060, 332);
        var ll = mkp(room.actors, "cu-ab", Q.cuLlama({ width: 280, body: "#EAD9BC", blanket: "#12A594" }), 520 - 140, 1050 - 0.955 * 308);
        S.breathe(tl, kil, 0, T, 0.8); S.breathe(tl, mar, 0.1, T, 0.8); S.breathe(tl, ale, 0.2, T, 0.8);
        Q.charBlink(tl, kil.svg, 2.2); Q.charBlink(tl, ale.svg, 4.4); Q.charBlink(tl, mar.svg, 6.4);
        // le Quetzal quitte l'epaule de Marina, file vers la montagne et la montre du bec
        var qz = S.quetzal(room.actors, 900 + 92, 1056 - 285, 180, "perched", false, "qh5");
        var tF = L1.t - 0.2;
        Q.quetzalPoseTo(tl, qz, "fly", tF, 0.35);
        Q.quetzalFlap(tl, qz, tF + 0.2, 6, 0.4, 0.8);
        tl.to(qz, { x: 520, y: -300, duration: 1.1, ease: "power2.out" }, tF);
        Q.quetzalPoseTo(tl, qz, "glide", tF + 1.2, 0.5);
        C.talkQuetzal(tl, qz, L1);
        // retour sur l'epaule de Marina pendant la reponse de Killa
        var tB = L2.t - 0.1;
        tl.to(qz, { x: 0, y: -8, duration: 1.2, ease: "power2.inOut" }, tB);
        Q.quetzalFlap(tl, qz, tB, 3, 0.4, 0.7);
        Q.quetzalPoseTo(tl, qz, "perched", tB + 1.2, 0.5);
        Q.quetzalBlink(tl, qz, tB + 2.2);
        [kil, mar, ale].forEach(function (c) { tl.to(c.svg.querySelector(".c-head"), { rotation: 7, svgOrigin: "200 288", duration: 0.8, ease: "sine.inOut" }, L1.t - 0.2); });
        [kil, mar, ale].forEach(function (c) { tl.to(c.svg.querySelector(".c-head"), { rotation: 0, svgOrigin: "200 288", duration: 0.6, ease: "sine.inOut" }, L2.t - 0.2); });
        C.talkBounce(tl, kil.b, L2, 6); C.talkChar(tl, kil, L2);
        Q.charEmote(tl, kil.svg, L2.t, "happy", 0.3);
        Q.charWave(tl, kil.svg, L2.t + L2.d - 1.3, 0.8, "L");
        S.hop(tl, ale, L2.t + L2.d - 1.0, 30); S.hop(tl, mar, L2.t + L2.d - 0.9, 26);
