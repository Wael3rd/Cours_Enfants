    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var P1 = C.planOf(PLAN, 1), P2 = C.planOf(PLAN, 2), W = P2.t0;
        var rot = (PLAN.meta.rotulo || "Evento · Día de Muertos · Oaxaca").split(" · ");
        var mk = function (parent, cls, html) { var d = document.createElement("div"); d.className = cls; d.setAttribute("data-layout-allow-overflow", ""); if (html) d.innerHTML = html; parent.appendChild(d); return d; };

        // ============================ PLAN 1 : la carte du Mexique ============================
        var mapbox = $("#mapbox");
        mapbox.innerHTML = Q.worldMap({ uid: "wm", states: { madrid: "done", salamanca: "done", sevilla: "done", cdmx: "done", oaxaca: "current", valencia: "open" }, player: "cdmx", initial: C.player.name.charAt(0).toUpperCase() });
        C.nameHooks.push(function (n) { var t = mapbox.querySelector(".m-token text"); if (t) t.textContent = n.charAt(0).toUpperCase(); });
        var oax = Q.mapRegion("oaxaca");
        var S1 = 3.4, off = 100 / (1.2 * S1);
        Q.mapCamSet(gsap, mapbox, { x: 640, y: 640 }, 0.74);
        Q.mapCamMove(tl, mapbox, { x: oax.x + 18, y: oax.y + off }, S1, 0.0, 1.3, "power2.inOut");
        tl.fromTo(mapbox, { rotation: -2.5, transformOrigin: "50% 50%" }, { rotation: 0, duration: 1.6, ease: "power2.out" }, 0);
        Q.mapFogDrift(tl, mapbox, 0, W + 0.2);
        Q.mapTravel(tl, mapbox, "cdmx", "oaxaca", 0.25, 0.95, gsap);
        Q.mapPulse(tl, mapbox, 1.3, 3, 0.9);
        tl.to(mapbox, { scale: 1.05, transformOrigin: "50% 30%", duration: W - 1.3, ease: "sine.inOut" }, 1.3);
        tl.set(mapbox.querySelector(".m-token"), { opacity: 1 }, 0);

        // carte-titre sur deux guirlandes de papel picado magenta / turquoise
        var tc = $("#tc");
        var tile = Q.azulejoDataUri({ a: "#2b1250", b: "#ff9f1c", c: "#d93472" }, 40);
        tc.innerHTML = '<div class="tcbox"><div class="band t" style="background-image:url(\'' + tile + '\')"></div><div class="band b" style="background-image:url(\'' + tile + '\')"></div></div>' +
          '<div class="tc-kicker" data-layout-allow-occlusion>' + rot[0].toUpperCase() + '</div><div class="tc-hola" data-layout-allow-occlusion><span data-layout-allow-occlusion>' + (rot[1] || "Día de Muertos").toUpperCase() + '</span></div><div class="tc-city" data-layout-allow-occlusion>' + (rot[2] || "Oaxaca").toUpperCase() + '</div>';
        var cols = ["#d93472", "#19b7aa", "#ff9f1c", "#9a5fd0"];
        $("#ppA").innerHTML = Q.papelPicado({ uid: "pa", w: 1920, h: 250, n: 8, colors: cols, seed: 3, sag: 50 });
        $("#ppB").innerHTML = Q.papelPicado({ uid: "pb", w: 1920, h: 250, n: 9, colors: cols.slice().reverse(), seed: 8, sag: 50 });
        $("#ppA").style.top = "250px"; $("#ppB").style.top = "770px";
        var rays = ""; for (var i = 0; i < 16; i++) { var a = (i / 16) * Math.PI * 2, b = a + Math.PI / 20; rays += '<path d="M700 700L' + (700 + Math.cos(a) * 760).toFixed(1) + " " + (700 + Math.sin(a) * 760).toFixed(1) + "L" + (700 + Math.cos(b) * 760).toFixed(1) + " " + (700 + Math.sin(b) * 760).toFixed(1) + 'Z"/>'; }
        $("#rays").innerHTML = '<svg width="1400" height="1400" viewBox="0 0 1400 1400"><g fill="#ffb347" opacity=".42">' + rays + "</g></svg>";
        // confettis : petales de papier cempasuchil / magenta / turquoise
        var rnd = Q.rng(21), ccols = ["#ff9f1c", "#d93472", "#19b7aa", "#ffc83d", "#9a5fd0", "#f5e6c8"], cfs = [];
        for (var k = 0; k < 30; k++) { var d = document.createElement("div"); d.className = "cf"; d.setAttribute("data-layout-allow-overflow", ""); d.style.background = ccols[k % ccols.length]; $("#p1").insertBefore(d, $("#flash")); cfs.push(d); }

        var tK = C.wordT(PLAN, 1, 1, 1), tH = C.wordT(PLAN, 1, 1, 3);
        tl.to(mapbox.querySelector(".m-token"), { opacity: 0, duration: 0.25 }, tH - 0.45);
        tl.set(tc, { opacity: 0 }, 0);
        tl.to("#mapdim", { opacity: 0.62, duration: 0.5, ease: "power2.out" }, tH - 0.35);
        [["#ppA", tH - 0.4, 3], ["#ppB", tH - 0.3, -3]].forEach(function (p) {
          tl.fromTo(p[0], { opacity: 0, y: p[2] * -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, p[1]);
          var fl = $(p[0]).querySelectorAll(".m-flag");
          fl.forEach(function (f, i) { tl.fromTo(f, { rotation: -3 - (i % 3) * 0.5, svgOrigin: f.dataset.px + " " + f.dataset.py }, { rotation: 3 + (i % 3) * 0.5, svgOrigin: f.dataset.px + " " + f.dataset.py, duration: 1.4 + (i % 4) * 0.1, ease: "sine.inOut", yoyo: true, repeat: C.reps(W - p[1], 1.4) }, p[1]); });
        });
        tl.fromTo(tc, { opacity: 0, y: 90, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, tH - 0.15);
        tl.set(".tc-hola, .tc-city", { opacity: 0 }, 0);
        tl.fromTo(".tcbox", { scaleY: 0.05, opacity: 0, transformOrigin: "50% 50%" }, { scaleY: 1, opacity: 1, duration: 0.42, ease: "back.out(1.4)" }, tH - 0.12);
        tl.fromTo(".tc-kicker", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, tK + 0.05);
        tl.fromTo(".tc-hola", { opacity: 0, scale: 2.2, rotation: -6, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, rotation: -2, duration: 0.5, ease: "expo.out" }, tH - 0.02);
        QCine.bloom(tl, "#flash", tH - 0.3, 0.2, 0.32, 0.7);
        tl.fromTo("#rays", { opacity: 0, scale: 0.3, rotation: -20 }, { opacity: 0.26, scale: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, tH - 0.02);
        tl.to("#rays", { rotation: 10, duration: W - tH, ease: "none" }, tH + 0.7);
        QCine.shake(tl, "#p1", tH, 8);
        tl.fromTo(".tc-city", { opacity: 0, clipPath: "polygon(0 0, 0 0, 0 50%, 0 100%, 0 100%, 0 50%)", x: -40 }, { opacity: 1, clipPath: "polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%)", x: 0, duration: 0.45, ease: "power3.out" }, tH + 0.32);
        tl.to("#tc", { y: -10, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, tH + 0.6);
        cfs.forEach(function (c, i) {
          var ang = rnd() * Math.PI * 2, dist = 380 + rnd() * 560, x1 = 960 + Math.cos(ang) * dist, y1 = 480 + Math.sin(ang) * dist * 0.7;
          var t0 = tH + 0.04 + rnd() * 0.06;
          tl.fromTo(c, { x: 960, y: 520, opacity: 1, scale: 0.4 + rnd() * 0.8, rotation: 0 }, { x: x1, y: y1, rotation: (rnd() - 0.5) * 300, duration: 0.7, ease: "expo.out", immediateRender: false }, t0);
          tl.to(c, { y: y1 + 520 + rnd() * 200, x: x1 + (rnd() - 0.5) * 160, rotation: "+=" + ((rnd() - 0.5) * 360), opacity: 0, duration: 1.5 + rnd() * 0.4, ease: "power1.in" }, t0 + 0.5);
        });
        for (var s = 0; s < 8; s++) {
          var sp = mk($("#p1"), "spark", '<svg width="60" height="60" viewBox="-30 -30 60 60"><path d="' + Q.sparklePath(0, 0, 26, 6) + '" fill="#ffd98a"/></svg>'); $("#p1").insertBefore(sp, $("#flash"));
          var sx = 220 + rnd() * 1480, sy = 130 + rnd() * 560, st = tH + 0.25 + s * 0.12;
          tl.fromTo(sp, { x: sx, y: sy, scale: 0, rotation: 0, opacity: 1 }, { scale: 0.6 + rnd() * 0.7, rotation: 60, duration: 0.4, ease: "power2.out", immediateRender: false }, st);
          tl.to(sp, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, st + 0.35);
        }

        // ============================ WHIP-PAN vers le plan 2 ============================
        var streaks = [];
        for (var q = 0; q < 7; q++) { var sk = document.createElement("div"); sk.className = "streak"; sk.setAttribute("data-layout-allow-overflow", ""); sk.style.top = 260 + q * 130 + (q % 2) * 40 + "px"; root.appendChild(sk); streaks.push(sk); }
        tl.fromTo("#p1", { x: 0, skewX: 0 }, { x: -2300, skewX: -16, duration: 0.34, ease: "power3.in", immediateRender: false }, W - 0.24);
        tl.set("#p1", { visibility: "hidden" }, W + 0.2);
        tl.set("#p2", { visibility: "visible" }, W - 0.2);
        tl.fromTo("#p2", { x: 2300, skewX: 16 }, { x: 0, skewX: 0, duration: 0.7, ease: "power3.out" }, W - 0.16);
        tl.set("#p2", { opacity: 0 }, 0);
        tl.to("#p2", { opacity: 1, duration: 0.45, ease: "sine.inOut" }, W - 0.16);
        streaks.forEach(function (sk, i) { tl.fromTo(sk, { x: 1700 + i * 90, opacity: 0.9, scaleX: 0.4 }, { x: -900, opacity: 0, scaleX: 1.6, duration: 0.42, ease: "power2.in", immediateRender: false }, W - 0.22 + i * 0.012); });

        // ============================ PLAN 2 : Oaxaca au crepuscule ============================
        var sky = Q.oaxacaSkyline({ uid: "ox" });
        $("#skyL").innerHTML = sky.sky; $("#sunL").innerHTML = sky.sun; $("#farL").innerHTML = sky.far; $("#midL").innerHTML = sky.mid; $("#nearL").innerHTML = sky.near;
        var span = P2.t1 - P2.t0 + 0.3, t0 = P2.t0 - 0.1;
        // personnages : Doña Remedios dans l'encadrement d'une porte (couche des facades), Beto a son etal + Xochitl qui court (couche du milieu)
        var dr = sky.doors.reduce(function (b, d) { return Math.abs(d.x - 1000) < Math.abs(b.x - 1000) ? d : b; }, sky.doors[0]);
        var rem = S.chr($("#midC"), "remedios", dr.x, dr.base + 4, 215);
        var beto = S.chr($("#acL"), "beto", sky.stall.x, 985, 225);
        var stall = mk($("#acL"), "", Q.oaxacaStall({ width: 600 })); stall.style.cssText = "position:absolute;left:" + (sky.stall.x - 300) + "px;top:" + 601 + "px;width:600px";
        var xo = S.chr($("#acL"), "xochitl", 300, 1040, 250);
        tl.fromTo("#skyL", { x: 0 }, { x: -100, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#sunL", { x: 0 }, { x: -140, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#farL", { x: 0 }, { x: -300, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#midL", { x: 0 }, { x: -700, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#midC", { x: 0 }, { x: -700, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#acL", { x: 0 }, { x: -1000, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#nearL", { x: 0 }, { x: -1280, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#motes", { x: 0 }, { x: -520, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#p2", { scale: 1.06, transformOrigin: "50% 60%" }, { scale: 1.0, duration: span, ease: "sine.out" }, t0);
        tl.fromTo("#sunL .sk-disc", { scale: 0.98, svgOrigin: sky.moonX + " " + sky.moonY }, { scale: 1.02, svgOrigin: sky.moonX + " " + sky.moonY, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 2.2) }, t0);
        document.querySelectorAll("#skyL .m-cloud").forEach(function (c, i) { tl.to(c, { x: 60 + (i % 3) * 40, duration: span, ease: "none" }, t0); });
        // fenetres chaudes qui respirent lentement, guirlandes de papel picado qui se balancent
        document.querySelectorAll("#midL .ox-win path:first-child").forEach(function (w, i) { if (i % 3 === 0) tl.to(w, { opacity: 0.72, duration: 1.2 + (i % 3) * 0.3, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.2) }, t0 + (i % 5) * 0.2); });
        document.querySelectorAll("#midL .m-flag").forEach(function (f, i) {
          tl.fromTo(f, { rotation: -4, svgOrigin: f.dataset.px + " " + f.dataset.py }, { rotation: 4, svgOrigin: f.dataset.px + " " + f.dataset.py, duration: 1.3 + (i % 4) * 0.15, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.3) }, t0 + (i % 6) * 0.1);
        });
        // bougies du premier plan : flamme qui respire (>= 0,9 s), halo doux
        document.querySelectorAll("#nearL .of-flame").forEach(function (f, i) {
          tl.fromTo(f, { scale: 0.94, svgOrigin: f.dataset.px + " " + f.dataset.py }, { scale: 1.06, svgOrigin: f.dataset.px + " " + f.dataset.py, duration: 0.9 + (i % 3) * 0.2, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 0.9) }, t0 + (i % 4) * 0.15);
        });
        document.querySelectorAll("#nearL .of-glow").forEach(function (g, i) { tl.fromTo(g, { opacity: 0.7 }, { opacity: 1, duration: 1.6 + (i % 3) * 0.3, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.6) }, t0 + (i % 4) * 0.2); });
        // pétales de cempasúchil qui flottent au-dessus de la rue (classe .spark : masqués en « Animations douces »)
        $("#motes").innerHTML = Q.moteField({ n: 36, w: 2400, h: 1200, seed: 9, rmin: 3, rmax: 7, colors: ["#ff9f1c", "#ffc83d", "#ffd98a"], stars: false });
        document.querySelectorAll("#motes .k-mote").forEach(function (m, i) {
          var x = +m.dataset.x, y = +m.dataset.y; m.classList.add("q-fx");
          tl.fromTo(m, { x: x, y: y, opacity: 0 }, { x: x + 40 - (i % 5) * 20, y: y - 120 - (i % 7) * 26, opacity: 0.85, duration: span * 0.5, ease: "sine.out" }, t0 + (i % 9) * 0.1);
          tl.to(m, { opacity: 0, duration: span * 0.5, ease: "sine.in" }, t0 + span * 0.5 + (i % 9) * 0.1);
        });
        // Xochitl court de la gauche vers la droite en sautillant ; Doña Remedios salue ; Beto retouche un alebrije
        S.walk(tl, xo, 300, 1500, t0 + 0.4, 3.8, 0.3, "power1.inOut");
        S.hop(tl, xo, t0 + 2.2, 40); S.hop(tl, xo, t0 + 3.6, 36);
        S.breathe(tl, rem, t0, span, 0.8); S.breathe(tl, beto, t0, span, 0.8);
        Q.charWave(tl, rem.svg, t0 + 1.4, 1.6, "R"); Q.charEmote(tl, rem.svg, t0 + 1.3, "happy", 0.3);
        Q.charEmote(tl, xo.svg, t0 + 0.4, "happy", 0.3); Q.charBlink(tl, rem.svg, t0 + 3.4); Q.charBlink(tl, beto.svg, t0 + 2.1);
        tl.to(beto.svg.querySelector(".c-armR"), { rotation: -34, svgOrigin: "258 306", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0 + 1.0);
        // pastille de lieu
        var chip = $("#chip");
        chip.innerHTML = '<svg width="46" height="58" viewBox="0 0 46 58"><path d="M23 56C6 36 4 28 4 22a19 19 0 1 1 38 0c0 6-2 14-19 34Z" fill="#d93472" stroke="#fff3d1" stroke-width="4"/><circle cx="23" cy="22" r="7" fill="#fff3d1"/></svg><b>' + (rot[2] || "Oaxaca").toUpperCase() + ", MÉXICO</b>";
        tl.fromTo(chip, { x: -760, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, P2.t0 + 0.35);
        tl.to(chip, { x: -760, opacity: 0, duration: 0.4, ease: "power3.in" }, P2.t1 - 0.5);

        // ============================ cadre commun + sous-titres ============================
        C.frame(tl, root, PLAN, { seed: 11 });
        C.subs(tl, root, PLAN, {});

        window.__timelines["e01-intro-1"] = tl;
      })();
    </script>
