        // Guinee equatoriale : la pastille turquoise de la carte + petit pays
        var gq = P(10, 1.7), gx = 1500 * S + OX, gy = 706 * S + OY;
        (function () {

        var cnt = { v: 0 }, t0 = L2.t, tEnd = L2.words[2].t + 0.35, fmt = function (n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); };
