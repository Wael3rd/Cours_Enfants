        var pin = function (c) { return '<svg width="30" height="38" viewBox="0 0 46 58"><path d="M23 56C6 36 4 28 4 22a19 19 0 1 1 38 0c0 6-2 14-19 34Z" fill="' + c + '" stroke="#14173f" stroke-width="5"/><circle cx="23" cy="22" r="7" fill="#14173f"/></svg>'; };

        var madrid = room.back.querySelector('.ac-feather[data-i="0"]');

        tl.to(madrid, { scale: 2.6, svgOrigin: mm.e + " " + mm.f, duration: 0.4, ease: "back.out(3)" }, L2.words[5].t);

          var ox = 760 + (k % 3) * 340 + rnd() * 120, tx = ox + (rnd() - 0.5) * 520, ty = 330 + rnd() * 120, tt = vamos + 0.03 + rnd() * 0.08;

          tl.to(c, { y: ty + 520 + rnd() * 160, x: tx + (rnd() - 0.5) * 140, rotation: "+=" + ((rnd() - 0.5) * 360), opacity: 0, duration: 1.7, ease: "power1.in" }, tt + 0.55);
        }

        C.subs(tl, root, PLAN, {});
