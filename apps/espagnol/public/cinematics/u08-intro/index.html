    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var P1 = C.planOf(PLAN, 1), P2 = C.planOf(PLAN, 2), W = P2.t0;
        var rot = (PLAN.meta.rotulo || "Capítulo 4 · ¿Cómo eres? · Ciudad de México").split(" · ");
        var mk = function (parent, cls, html) { var d = document.createElement("div"); d.className = cls; d.setAttribute("data-layout-allow-overflow", ""); if (html) d.innerHTML = html; parent.appendChild(d); return d; };

        // ============================ PLAN 1 : la carte, de Buenos Aires à Bogotá ============================
        var mapbox = $("#mapbox");
        mapbox.innerHTML = Q.worldMap({ uid: "wm", states: { madrid: "done", salamanca: "done", sevilla: "done", cdmx: "done", oaxaca: "done", valencia: "done", baires: "done", bogota: "current" }, player: "baires", initial: C.player.name.charAt(0).toUpperCase() });
        C.nameHooks.push(function (n) { var t = mapbox.querySelector(".m-token text"); if (t) t.textContent = n.charAt(0).toUpperCase(); });
        var sv = mapbox.querySelector("svg"), firstPlq = sv.querySelector(".m-plq");
        firstPlq.insertAdjacentHTML("beforebegin", Q.mapFogHtml("bogota"));
        var bog = Q.mapRegion("bogota"), bai = Q.mapRegion("baires");
        var S1 = 3.1, off = 100 / (1.2 * S1);
        Q.mapCamSet(gsap, mapbox, { x: 760, y: 760 }, 1.15);
        Q.mapCamMove(tl, mapbox, { x: 760, y: 760 }, 1.15, 0.0, 0.01, "none");
        Q.mapCamMove(tl, mapbox, { x: bog.x + 10, y: bog.y + off }, S1, 1.3, 1.7, "power2.inOut");
        tl.fromTo(mapbox, { rotation: -2.5, transformOrigin: "50% 50%" }, { rotation: 0, duration: 1.6, ease: "power2.out" }, 0);
        Q.mapFogDrift(tl, mapbox, 0, W + 0.2);
        Q.mapPulse(tl, mapbox, 1.3, 3, 0.9);
        tl.to(mapbox, { scale: 1.05, transformOrigin: "50% 30%", duration: W - 3.0, ease: "sine.inOut" }, 3.0);
        // la ligne dorée remonte vers le nord au-dessus des Andes, le pion la suit, les nuages de Bogotá s'écartent
        Q.mapTravel(tl, mapbox, "baires", "bogota", 0.3, 1.9, gsap);
        Q.mapFogClear(tl, mapbox, "bogota", 2.0, 1.4);
        tl.set(mapbox.querySelector(".m-token"), { opacity: 1 }, 0);

        // carte-titre (affiche de voyage)
        var tc = $("#tc");
        var tile = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40">' + ["#d8283a", "#fcc919", "#2f6fd0", "#1fa26b"].map(function (c, i) { return '<path d="M' + (i * 40 + 3) + ' 0h34v28l-4 -4 -4 4 -4 -4 -4 4 -4 -4 -4 4 -4 -4 -4 4Z" fill="' + c + '"/><circle cx="' + (i * 40 + 20) + '" cy="11" r="5" fill="#14173f"/><path d="M' + (i * 40 + 20) + ' 17l4 4 -4 4 -4 -4Z" fill="#14173f"/>'; }).join("") + "</svg>");
        var tt = (rot[1] || "Mi casa y mi barrio").toUpperCase().split(" Y ");
        tc.innerHTML = '<div class="tcbox"><div class="band t" style="background-image:url(\'' + tile + '\')"></div><div class="band b" style="background-image:url(\'' + tile + '\')"></div></div>' +
          '<div class="tc-kicker">' + rot[0].toUpperCase() + '</div><div class="tc-hola"><span>' + tt[0] + '</span>' + (tt[1] ? '<span>Y ' + tt[1] + '</span>' : '') + '</div><div class="tc-city">' + (rot[2] || "Bogotá").toUpperCase() + '</div>';
        var rays = ""; for (var i = 0; i < 16; i++) { var a = (i / 16) * Math.PI * 2, b = a + Math.PI / 20; rays += '<path d="M700 700L' + (700 + Math.cos(a) * 760).toFixed(1) + " " + (700 + Math.sin(a) * 760).toFixed(1) + "L" + (700 + Math.cos(b) * 760).toFixed(1) + " " + (700 + Math.sin(b) * 760).toFixed(1) + 'Z"/>'; }
        $("#rays").innerHTML = '<svg width="1400" height="1400" viewBox="0 0 1400 1400"><g fill="#ffd76a" opacity=".42">' + rays + "</g></svg>";
        // eclats de carreaux (confettis) : creme, ocre, cobalt, terracotta
        var rnd = Q.rng(21), cols = ["#d93472", "#ffc83d", "#19b7aa", "#c9573b", "#ff9f1c", "#ff7fb0"], cfs = [];
        for (var k = 0; k < 30; k++) { var d = document.createElement("div"); d.className = "cf"; d.setAttribute("data-layout-allow-overflow", ""); d.style.background = cols[k % cols.length]; $("#p1").insertBefore(d, $("#flash")); cfs.push(d); }

        var tK = C.wordT(PLAN, 1, 1, 1), tH = C.wordT(PLAN, 1, 1, 3);
        tl.to(mapbox.querySelector(".m-token"), { opacity: 0, duration: 0.25 }, tH - 0.45);
        tl.set(tc, { opacity: 0 }, 0);
        tl.to("#mapdim", { opacity: 0.55, duration: 0.5, ease: "power2.out" }, tH - 0.35);
        tl.fromTo(tc, { opacity: 0, y: 90, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, tH - 0.15);
        tl.set(".tc-hola, .tc-city", { opacity: 0 }, 0);
        tl.fromTo(".tcbox", { scaleY: 0.05, opacity: 0, transformOrigin: "50% 50%" }, { scaleY: 1, opacity: 1, duration: 0.42, ease: "back.out(1.4)" }, tH - 0.12);
        tl.fromTo(".tc-kicker", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, tH - 0.1);
        tl.fromTo(".tc-hola", { opacity: 0, scale: 2.6, rotation: -7, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, rotation: -2, duration: 0.5, ease: "expo.out" }, tH - 0.02);
        QCine.bloom(tl, "#flash", tH - 0.3, 0.2, 0.32, 0.7);
        tl.fromTo("#rays", { opacity: 0, scale: 0.3, rotation: -20 }, { opacity: 0.28, scale: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, tH - 0.02);
        tl.to("#rays", { rotation: 10, duration: W - tH, ease: "none" }, tH + 0.7);
        QCine.shake(tl, "#p1", tH, 8);
        tl.fromTo(".tc-city", { opacity: 0, clipPath: "polygon(0 0, 0 0, 0 50%, 0 100%, 0 100%, 0 50%)", x: -40 }, { opacity: 1, clipPath: "polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%)", x: 0, duration: 0.45, ease: "power3.out" }, tH + 0.32);
        tl.to("#tc", { y: -10, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, tH + 0.6);
        cfs.forEach(function (c, i) {
          var ang = rnd() * Math.PI * 2, dist = 380 + rnd() * 560, x1 = 960 + Math.cos(ang) * dist, y1 = 480 + Math.sin(ang) * dist * 0.7;
          var t0 = tH + 0.04 + rnd() * 0.06;
          tl.fromTo(c, { x: 960, y: 520, opacity: 1, scale: 0.4 + rnd() * 0.8, rotation: 0 }, { x: x1, y: y1, rotation: (rnd() - 0.5) * 300, duration: 0.7, ease: "expo.out", immediateRender: false }, t0);
          tl.to(c, { y: y1 + 520 + rnd() * 200, x: x1 + (rnd() - 0.5) * 160, rotation: "+=" + ((rnd() - 0.5) * 360), opacity: 0, duration: 1.5 + rnd() * 0.4, ease: "power1.in" }, t0 + 0.5);
        });
        for (var s = 0; s < 8; s++) {
          var sp = mk($("#p1"), "spark", '<svg width="60" height="60" viewBox="-30 -30 60 60"><path d="' + Q.sparklePath(0, 0, 26, 6) + '" fill="#fff3d1"/></svg>'); $("#p1").insertBefore(sp, $("#flash"));
          var sx = 220 + rnd() * 1480, sy = 130 + rnd() * 560, st = tH + 0.25 + s * 0.12;
          tl.fromTo(sp, { x: sx, y: sy, scale: 0, rotation: 0, opacity: 1 }, { scale: 0.6 + rnd() * 0.7, rotation: 60, duration: 0.4, ease: "power2.out", immediateRender: false }, st);
          tl.to(sp, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, st + 0.35);
        }

        // ============================ WHIP-PAN vers le plan 2 ============================
        var streaks = [];
        for (var q = 0; q < 7; q++) { var sk = document.createElement("div"); sk.className = "streak"; sk.setAttribute("data-layout-allow-overflow", ""); sk.style.top = 260 + q * 130 + (q % 2) * 40 + "px"; root.appendChild(sk); streaks.push(sk); }
        tl.fromTo("#p1", { x: 0, skewX: 0 }, { x: -2300, skewX: -16, duration: 0.34, ease: "power3.in", immediateRender: false }, W - 0.24);
        tl.set("#p1", { visibility: "hidden" }, W + 0.2);
        tl.set("#p2", { visibility: "visible" }, W - 0.2);
        tl.fromTo("#p2", { x: 2300, skewX: 16 }, { x: 0, skewX: 0, duration: 0.7, ease: "power3.out" }, W - 0.16);
        tl.set("#p2", { opacity: 0 }, 0);
        tl.to("#p2", { opacity: 1, duration: 0.45, ease: "sine.inOut" }, W - 0.16);
        streaks.forEach(function (sk, i) { tl.fromTo(sk, { x: 1700 + i * 90, opacity: 0.9, scaleX: 0.4 }, { x: -900, opacity: 0, scaleX: 1.6, duration: 0.42, ease: "power2.in", immediateRender: false }, W - 0.22 + i * 0.012); });

        // ============================ PLAN 2 : Triana a l'heure doree ============================
        var sky = Q.bogotaSkyline({ uid: "bg", mk: 1800 });
        $("#skyL").innerHTML = sky.sky; $("#sunL").innerHTML = sky.sun; $("#farL").innerHTML = sky.far; $("#midL").innerHTML = sky.mid; $("#nearL").innerHTML = sky.near;
        var span = P2.t1 - P2.t0 + 0.3, t0 = P2.t0 - 0.1;
        tl.fromTo("#skyL", { x: 0 }, { x: -120, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#sunL", { x: 0 }, { x: -160, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#farL", { x: 0 }, { x: -320, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#midL", { x: 0 }, { x: -700, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#nearL", { x: 0 }, { x: -1280, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#motes", { x: 0 }, { x: -520, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#p2", { scale: 1.06, transformOrigin: "50% 60%" }, { scale: 1.0, duration: span, ease: "sine.out" }, t0);
        var rays2 = $("#sunL .sk-rays");
        tl.fromTo(rays2, { rotation: 0, svgOrigin: rays2.dataset.px + " " + rays2.dataset.py }, { rotation: 22, svgOrigin: rays2.dataset.px + " " + rays2.dataset.py, duration: span, ease: "none" }, t0);
        tl.fromTo("#sunL .sk-disc", { scale: 0.97, svgOrigin: sky.sunX + " " + sky.sunY }, { scale: 1.03, svgOrigin: sky.sunX + " " + sky.sunY, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.8) }, t0);
        document.querySelectorAll("#skyL .m-cloud").forEach(function (c, i) { tl.to(c, { x: 60 + (i % 3) * 40, duration: span, ease: "none" }, t0); });
        // le fleuve scintille : traits de lumiere qui glissent et clignent
        document.querySelectorAll("#nearL .mx-jet").forEach(function (j, i) {
          tl.to(j, { opacity: 0.35, y: 5, duration: 0.45 + (i % 3) * 0.1, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(span / (0.45 + (i % 3) * 0.1))) }, t0 + i * 0.07);
        });
        // petales de jacaranda qui tombent (deterministe)
        var prnd = Q.rng(77);
        for (var pI = 0; pI < 24; pI++) {
          var pt = mk($("#p2"), "cf petal", '<svg width="26" height="16" viewBox="-13 -8 26 16"><ellipse rx="12" ry="6" fill="' + (pI % 3 ? "#ffd9a0" : "#f7a8c4") + '"/></svg>'); pt.style.clipPath = "none"; pt.style.background = "none"; pt.setAttribute("data-layout-ignore", "");
          $("#p2").insertBefore(pt, $("#nearL"));
          var px0 = 80 + prnd() * 1760, py0 = -40 - prnd() * 200, dur = 4 + prnd() * 2.4, st0 = t0 + prnd() * (span - 2);
          tl.fromTo(pt, { x: px0, y: py0, rotation: prnd() * 180, opacity: 0 }, { x: px0 + 120 - prnd() * 240, y: 900 + prnd() * 200, rotation: "+=" + (120 + prnd() * 160), opacity: 0.9, duration: dur, ease: "none", immediateRender: false }, st0);
          tl.to(pt, { opacity: 0, duration: 0.6 }, st0 + dur - 0.6);
        }
        // fenetres allumees de Triana qui scintillent
        document.querySelectorAll("#midL svg rect[fill='#FFD98A']").forEach(function (r, i) { if (i % 5 === 0) tl.to(r, { opacity: 0.35, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0 + 0.4 + (i % 7) * 0.5); });
        $("#motes").innerHTML = Q.moteField({ n: 40, w: 2400, h: 1200, seed: 9, rmin: 2, rmax: 6, stars: true });
        document.querySelectorAll("#motes .k-mote").forEach(function (m, i) {
          var x = +m.dataset.x, y = +m.dataset.y;
          tl.fromTo(m, { x: x, y: y, opacity: 0 }, { x: x + 40 - (i % 5) * 20, y: y - 160 - (i % 7) * 30, opacity: 0.9, duration: span * 0.5, ease: "sine.out" }, t0 + (i % 9) * 0.1);
          tl.to(m, { opacity: 0, duration: span * 0.5, ease: "sine.in" }, t0 + span * 0.5 + (i % 9) * 0.1);
        });
        // hirondelles qui traversent le ciel
        for (var bI = 0; bI < 7; bI++) {
          var bd = mk($("#p2"), "bird", '<svg width="70" height="34" viewBox="-35 -17 70 34"><path class="wing" d="M-30 -2Q-16 -18 0 2Q16 -18 30 -2" stroke="#1d2160" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'); bd.setAttribute("data-layout-ignore", "");
          $("#p2").insertBefore(bd, $("#nearL"));
          var by = 170 + bI * 55 + (bI % 2) * 30, bs = 0.7 + (bI % 3) * 0.25, bx0 = 2100 + bI * 150;
          tl.fromTo(bd, { x: bx0, y: by, scale: bs }, { x: bx0 - 2800, y: by - 80 + (bI % 3) * 40, duration: span + 1.0, ease: "none" }, t0 - 0.3);
          tl.fromTo(bd.querySelector(".wing"), { scaleY: 1, svgOrigin: "0 0" }, { scaleY: -0.7, svgOrigin: "0 0", duration: 0.32 + bI * 0.03, ease: "sine.inOut", yoyo: true, repeat: C.reps(span + 1.0, 0.32 + bI * 0.03) + 1 }, t0 - 0.3);
        }
        // le bus rouge traverse la rue ; le point vert de la plume clignote doucement au sommet de Monserrate
        var bus = $("#farL, #nearL") && document.querySelector("#nearL .bg-buswrap");
        if (bus) tl.fromTo(bus, { x: -700 }, { x: 3300, duration: span + 1.0, ease: "none" }, t0 - 0.5);
        var pd = document.querySelector("#farL .bg-pdot");
        if (pd) { tl.fromTo(pd.querySelector("circle"), { opacity: 0.2 }, { opacity: 0.6, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.3) + 1 }, t0 + 0.5); }
        // pastille de lieu
        var chip = $("#chip");
        chip.innerHTML = '<svg width="46" height="58" viewBox="0 0 46 58"><path d="M23 56C6 36 4 28 4 22a19 19 0 1 1 38 0c0 6-2 14-19 34Z" fill="#c81f30" stroke="#fff3d1" stroke-width="4"/><circle cx="23" cy="22" r="7" fill="#fff3d1"/></svg><b>' + "BOGOTÁ, COLOMBIA</b>";
        tl.fromTo(chip, { x: -760, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, P2.t0 + 0.35);
        tl.to(chip, { x: -760, opacity: 0, duration: 0.4, ease: "power3.in" }, P2.t1 - 0.5);

        // ============================ cadre commun + sous-titres ============================
        C.frame(tl, root, PLAN, { seed: 11 });
        C.subs(tl, root, PLAN, {});

        window.__timelines["u08-intro"] = tl;
      })();
    </script>
