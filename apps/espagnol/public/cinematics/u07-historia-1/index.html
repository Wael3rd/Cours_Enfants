    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var mkp = function (layer, cls, html, x, y) { var d = S.mk(layer, cls, html); d.setAttribute("data-layout-allow-overflow", ""); d.setAttribute("data-layout-ignore", ""); gsap.set(d, { x: x, y: y }); return d; };
        var P = C.planOf(PLAN, 1), L1 = P.lines[0], L2 = P.lines[1], T = PLAN.total;
        var set = Q.baCaminito({ uid: "bc" });
        var room = S.set($("#stage"), set, { below: "#8A6A48", motes: 16 });
        S.drift(tl, room, T);

        // ---------- Alex et Marina, le Quetzal sur l'epaule de Marina ----------
        var ale = S.chr(room.actors, "viajero", 700, 1040, 330), mar = S.chr(room.actors, "marina", 880, 1030, 322);
        S.breathe(tl, ale, 0.1, T, 0.8); S.breathe(tl, mar, 0.2, T, 0.8);
        Q.charBlink(tl, ale.svg, 2.4); Q.charBlink(tl, mar.svg, 4.4);
        var qz = S.quetzal(room.actors, 975, 770, 190, "perched", false, "qh1");
        Q.quetzalSway(tl, qz, 0.2, T - 0.4, 1);
        Q.quetzalBlink(tl, qz, 1.8); Q.quetzalBlink(tl, qz, 5.6);

        // ---------- Facu arrive en courant par la droite, ballon sous le pied ----------
        var fac = S.chr(room.actors, "facu", 3150, 1040, 340);
        var tR = 0.05, dR = 1.65, xF = 1400;
        S.walk(tl, fac, 3150, xF, tR, dR, 0.22, "power2.out");
        var bl = mkp(room.actors, "ball", Q.baProp("balon", { width: 90, uid: "bl1" }), 3000, 960);
        tl.fromTo(bl, { x: 3000 }, { x: xF + 150, duration: dR + 0.1, ease: "power2.out", immediateRender: false }, tR);
        tl.fromTo(bl, { rotation: 0, transformOrigin: "50% 50%" }, { rotation: -900, duration: dR + 0.1, ease: "power2.out", immediateRender: false }, tR);
        tl.to(bl, { y: 880, duration: 0.2, ease: "power2.out" }, tR + dR + 0.1);
        tl.to(bl, { y: 960, duration: 0.25, ease: "power2.in" }, tR + dR + 0.3);
        tl.to(bl, { y: 925, duration: 0.14, ease: "power2.out" }, tR + dR + 0.55);
        tl.to(bl, { y: 960, duration: 0.16, ease: "power2.in" }, tR + dR + 0.69);
        tl.fromTo(fac.b, { scaleX: 1, scaleY: 1 }, { scaleX: 1.07, scaleY: 0.94, duration: 0.12, ease: "power2.in", transformOrigin: "50% 100%", immediateRender: false }, tR + dR - 0.05);
        tl.to(fac.b, { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1,0.45)" }, tR + dR + 0.08);
        S.breathe(tl, fac, tR + dR, T - tR - dR, 0.8);
        C.talkBounce(tl, fac.b, L1, 6); C.talkChar(tl, fac, L1);
        Q.charWave(tl, fac.svg, tR + dR + 0.1, 1.0, "R");            // « ¡Che, viajeros! »
        Q.charEmote(tl, fac.svg, L1.t, "happy", 0.3);
        Q.charBlink(tl, fac.svg, L1.t + 2.8);
        S.hop(tl, ale, L1.t + 1.9, 26);
        Q.charNod(tl, mar.svg, L1.t + 3.0, 4, 0.2);

        // ---------- Marina : « hoy hace mucho calor » (elle s'evente avec la main) ----------
        C.talkChar(tl, mar, L2);
        Q.charEmote(tl, mar.svg, L2.t, "worry", 0.3);
        var wCalor = C.wordT(PLAN, 1, 2, 5);
        Q.charWave(tl, mar.svg, wCalor - 0.1, 1.0, "L");
        for (var k = 0; k < 4; k++) {
          var dr = mkp(room.qlayer, "fan", "", 800 + k * 14, 560 + (k % 2) * 16);
          tl.fromTo(dr, { opacity: 0, y: 560 + (k % 2) * 16, scale: 0.6 }, { opacity: 0.8, y: 690 + k * 14, scale: 1, duration: 0.5, ease: "power1.in", immediateRender: false }, wCalor + k * 0.12);
          tl.to(dr, { opacity: 0, duration: 0.25 }, wCalor + 0.3 + k * 0.12);
        }
        // caresse de chaleur : le soleil est plus present sur « mucho calor »
        tl.fromTo(room.light, { opacity: 0.4 }, { opacity: 0.75, duration: 0.8, ease: "sine.inOut", immediateRender: false }, wCalor - 0.2);

        // ---------- camera : plan large -> pousse vers le groupe ----------
        S.camSet(room, 1500, 650, 0.66);
        S.cam(tl, room, 1180, 760, 0.95, 0, tR + 1.9, "sine.inOut");
        S.cam(tl, room, 1160, 770, 1.1, tR + 1.9, T - tR - 2.1, "power1.inOut");
        tl.fromTo("#stage", { rotation: 0.8, transformOrigin: "50% 50%" }, { rotation: 0, duration: 1.4, ease: "power2.out" }, 0);

        var fr = C.frame(tl, root, PLAN, { seed: 5, fadeOut: 0.3 });
        if (fr.garland) fr.garland.setAttribute("data-layout-allow-overflow", "");
        C.subs(tl, root, PLAN, {});
        window.__timelines["u07-historia-1"] = tl;
      })();
