    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });

        var $ = function (s) { return document.querySelector(s); };
        var mkp = function (layer, cls, html, x, y) { var d = S.mk(layer, cls, html); d.setAttribute("data-layout-allow-overflow", ""); d.setAttribute("data-layout-ignore", ""); gsap.set(d, { x: x, y: y }); return d; };
        var P = C.planOf(PLAN, 4), LQ = P.lines[0], LS = P.lines[1], T = PLAN.total;
        var set = Q.baSanTelmo({ uid: "bt" });
        var room = S.set($("#stage"), set, { below: "#7A5C3E", motes: 10 });
        S.drift(tl, room, T);

        // ---------- Sol (guitare) a gauche, Don Aníbal et son bandoneon au centre ----------
        var sol = S.chr(room.actors, "sol", 2130, 1040, 330);
        S.prop(room.actors, "guitarra", 2170, 770, 118); var gt = room.actors.lastChild; gsap.set(gt, { rotation: 18, transformOrigin: "50% 50%" });
        var ani = S.chr(room.actors, "anibal", 2640, 1040, 340);
        S.breathe(tl, sol, 0, T, 0.7); S.breathe(tl, ani, 0.1, T, 0.7); Q.charBlink(tl, sol.svg, 5.2); Q.charBlink(tl, ani.svg, 3.6);
        Q.charEmote(tl, sol.svg, 0.3, "worry", 0.3); Q.charEmote(tl, ani.svg, 0.3, "worry", 0.3);
        var bd = S.mk(room.actors, "band", Q.baProp("bandoneon", { width: 400, uid: "bn" })); bd.setAttribute("data-layout-allow-overflow", ""); bd.setAttribute("data-layout-ignore", ""); gsap.set(bd, { x: 2440, y: 760, rotation: -4, transformOrigin: "50% 50%" });
        var bel = bd.querySelector(".ba-bellows"), rgt = bd.querySelector(".ba-right"), glow = bd.querySelector(".ba-glow");
        // le soufflet s'entrouvre : un reflet vert entre les plis (halo lent, jamais plus de 0,9, montee 0,9 s)
        tl.to(bel, { scaleX: 1.35, svgOrigin: "100 150", duration: 0.9, ease: "sine.inOut" }, 0.3);
        tl.to(rgt, { x: 200 * 0.35, duration: 0.9, ease: "sine.inOut" }, 0.3);
        tl.fromTo(glow, { opacity: 0 }, { opacity: 0.85, duration: 0.9, ease: "sine.inOut", immediateRender: false }, LQ.t - 0.5);
        tl.to(glow, { opacity: 0.5, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: C.reps(T - LQ.t, 1.8) + 1 }, LQ.t + 0.45);
        for (var s = 0; s < 6; s++) {
          var sp = mkp(room.actors, "spk q-fx", '<svg width="46" height="46" viewBox="-23 -23 46 46"><path d="' + Q.sparklePath(0, 0, 20, 5) + '" fill="#b6ffd9"/></svg>', 2600 + (s % 3) * 70, 860 - (s % 2) * 40);
          tl.fromTo(sp, { scale: 0, opacity: 0 }, { scale: 0.8, opacity: 0.9, duration: 0.5, ease: "power2.out", immediateRender: false }, LQ.t + 0.2 + s * 0.35);
          tl.to(sp, { scale: 0, opacity: 0, duration: 0.5, ease: "power2.in" }, LQ.t + 0.8 + s * 0.35);
        }

        // ---------- le Quetzal arrive en vol et se pose sur le coin du bandoneon ----------
        var qz = S.quetzal(room.actors, 2540, 770, 190, "perched", false, "qh5");
        var tQ = 0.2;
        tl.set(qz, { opacity: 0 }, 0);
        tl.fromTo(qz, { opacity: 0, x: -520, y: -190, scale: 0.6 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 1.2, ease: "power2.out", immediateRender: false }, tQ);
        Q.quetzalPoseTo(tl, qz, "fly", tQ, 0.3);
        Q.quetzalFlap(tl, qz, tQ + 0.1, 5, 0.3, 0.8);
        Q.quetzalPoseTo(tl, qz, "perched", tQ + 1.15, 0.4);
        Q.quetzalSway(tl, qz, tQ + 1.6, T - tQ - 1.8, 1);
        C.talkQuetzal(tl, qz, LQ);
        // Sol serre sa guitare et hoche la tete
        C.talkChar(tl, sol, LS); C.talkBounce(tl, sol.b, LS, 5);
        Q.charEmote(tl, sol.svg, LS.t, "happy", 0.3);
        tl.to(gt, { rotation: 8, duration: 0.5, ease: "sine.inOut" }, LS.t);
        S.hop(tl, sol, C.wordT(PLAN, 4, 2, 13), 30);

        // ---------- camera : gros plan sur le soufflet ----------
        S.camSet(room, 2420, 800, 1.2);
        S.cam(tl, room, 2540, 850, 1.75, 0, LQ.t + 1.6, "power2.inOut");
        S.cam(tl, room, 2400, 830, 1.5, LS.t - 0.3, 1.2, "sine.inOut");

        var fr = C.frame(tl, root, PLAN, { seed: 9, fadeOut: 0.3 });
        if (fr.garland) fr.garland.setAttribute("data-layout-allow-overflow", "");
        C.subs(tl, root, PLAN, {});
