    <script>

        var tl = gsap.timeline({ paused: true });

        var M = Q.machuPicchu({ uid: "mp" });
        var wrap = function (h) { return '<div class="mp-l">' + h + "</div>"; };
        var set = { back: wrap(M.sky) + wrap(M.back) + wrap(M.sea), front: M.front, light: M.light, W: M.W, H: M.H };
        var room = S.set($("#stage"), set, { below: "#7A6A58", motes: 22, moteColors: ["#FFE9A8", "#FFD76A", "#FFFFFF"] });

        var FL = 1456;
        // la mer de nuages respire tres lentement, le soleil monte
        room.back.querySelectorAll(".cu-sea1, .cu-sea2, .cu-sea3").forEach(function (s, i) { tl.fromTo(s, { x: 0 }, { x: (i % 2 ? 1 : -1) * (60 + i * 30), duration: T, ease: "sine.inOut" }, 0); });
        tl.fromTo(room.back.querySelector(".cu-sundisc"), { y: 0 }, { y: -70, duration: T, ease: "sine.inOut" }, 0);

        var mar = S.chr(room.actors, "marina", 930, FL, 322), ale = S.chr(room.actors, "viajero", 1200, FL + 6, 332);
        S.breathe(tl, mar, 0, T, 0.6); S.breathe(tl, ale, 0.1, T, 0.6);
        var qz = S.quetzal(room.actors, 1200 + 96, FL + 6 - 290, 180, "perched", false, "qf1");
        Q.quetzalPoseTo(tl, qz, "sad", 0.2, 0.6); Q.quetzalBlink(tl, qz, 2.6); Q.quetzalBlink(tl, qz, 6.3);
        Q.charEmote(tl, ale.svg, 0.2, "worry", 0.5); Q.charEmote(tl, mar.svg, 0.2, "worry", 0.5);
        Q.charBlink(tl, ale.svg, 2.2); Q.charBlink(tl, mar.svg, 3.7); Q.charBlink(tl, ale.svg, 6.2);
        var SX = 1780, SW = 250, SH = 300;

        tl.set(sb, { opacity: 0 }, 0);

        Q.sombraFloat(tl, sb, 0.4, Math.max(1, Math.floor(T / 3.6)), 3.6);

        tl.to(sb, { scale: 0.96, duration: 1.8, ease: "sine.inOut", transformOrigin: "50% 100%", yoyo: true, repeat: 1 }, L1.t + 0.5);
        tl.to(sb, { x: "+=14", duration: 1.6, ease: "sine.inOut" }, L1.t + L1.d - 1.4);   // elle se tasse un peu
        Q.sombraEyes(tl, sb, L2.t + 0.4, "open", 0.7);                           // « Nosotros te escuchamos » : ses yeux s'ouvrent

        // ---------- Alex s'avance, s'accroupit et tend la main ; Marina le suit d'un pas ----------
        var tW = L1.t + L1.d + 0.35, dW = 1.4, xA = 1470;
        S.walk(tl, ale, 1200, xA, tW, dW, 0.42, "sine.inOut");
        tl.to(qz, { x: xA - 1200, duration: dW, ease: "sine.inOut" }, tW);
        S.walk(tl, mar, 930, 1170, tW + 0.35, dW, 0.42, "sine.inOut");
        S.breathe(tl, ale, tW + dW, T - tW - dW, 0.5);
        var tC = L2.t - 0.15;
        tl.to(ale.b, { scaleY: 0.86, scaleX: 1.04, y: 6, duration: 0.7, ease: "sine.inOut", transformOrigin: "50% 100%" }, tC);
        tl.to(ale.svg.querySelector(".c-armR"), { rotation: -82, svgOrigin: "258 306", duration: 0.8, ease: "sine.inOut" }, tC + 0.3);
