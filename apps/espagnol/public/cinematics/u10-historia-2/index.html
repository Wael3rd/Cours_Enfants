    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var P = C.planOf(PLAN, 1), L = P.lines[0], T = PLAN.total;
        var w = function (k) { return C.wordT(PLAN, 1, 1, k); };
        var mkp = function (layer, cls, html, x, y) { var d = S.mk(layer, cls, html); d.setAttribute("data-layout-allow-overflow", ""); d.setAttribute("data-layout-ignore", ""); gsap.set(d, { x: x, y: y }); return d; };
        var set = Q.plazaDeArmas({ uid: "pa" });
        var room = S.set($("#stage"), set, { below: "#B59471", motes: 14 });
        S.drift(tl, room, T); S.fountain(tl, room, T);

        // ---------- le groupe, comme a la fin de la partie precedente ----------
        var ale = S.chr(room.actors, "viajero", 700, 1040, 330), mar = S.chr(room.actors, "marina", 880, 1030, 322);
        S.breathe(tl, ale, 0, T, 0.8); S.breathe(tl, mar, 0.1, T, 0.8);
        var qz = S.quetzal(room.actors, 975, 770, 200, "perched", false, "qh2");
        gsap.set(qz, { y: -8 });
        Q.quetzalBlink(tl, qz, 1.6); Q.quetzalBlink(tl, qz, 6.2);
        Q.charBlink(tl, ale.svg, 2.6); Q.charBlink(tl, mar.svg, 5.0);

        // ---------- Killa et son lama (a l'endroit ou la partie 1 les a laisses) arrivent jusqu'au groupe ----------
        var kil = S.chr(room.actors, "killa", 2420, 1040, 330);
        var ll = mkp(room.actors, "cu-ab", Q.cuLlama({ width: 300, body: "#EAD9BC", blanket: "#12A594" }), 2540 - 150, 1040 - 0.955 * 330);
        gsap.set(ll.querySelector("svg"), { scaleX: -1, transformOrigin: "50% 50%" });
        var tW = L.t - 0.5, dW = 2.1;
        S.walk(tl, kil, 2420, 1380, tW, dW, 0.3, "power1.inOut");
        tl.to(ll, { x: 1540 - 150, duration: dW + 0.15, ease: "power1.inOut" }, tW + 0.1);
        for (var b = 0; b < Math.floor(dW / 0.34); b++) tl.to(ll, { y: "-=10", duration: 0.17, ease: "sine.out", yoyo: true, repeat: 1 }, tW + 0.1 + b * 0.34);
        S.breathe(tl, kil, tW + dW, T - tW - dW, 0.8);
        C.talkBounce(tl, kil.b, L, 6); C.talkChar(tl, kil, L);
        Q.charWave(tl, kil.svg, L.t - 0.05, 1.0, "R");                       // « ¡Hola! »
        Q.charEmote(tl, kil.svg, L.t, "happy", 0.3);
        tl.to(ll.querySelector(".cu-ll-head"), { rotation: 8, svgOrigin: "130 110", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, tW + dW);
        Q.charBlink(tl, kil.svg, L.t + 3.2);
        // Alex et Marina se tournent vers elle : petits rebonds d'attention
        S.hop(tl, ale, L.t + 0.2, 24); Q.charNod(tl, mar.svg, L.t + 2.4, 4, 0.2);
        Q.quetzalPoseTo(tl, qz, "happy", L.t + 0.3, 0.4); Q.quetzalPoseTo(tl, qz, "perched", L.t + 1.6, 0.5);
        S.hop(tl, mar, w(10) - 0.1, 22); S.hop(tl, ale, w(10), 26);                 // « ¡Bienvenidos al Cusco! »

        // ---------- « killa » = luna : une lune de jour se leve dans le ciel au-dessus de la cathedrale ----------
        var moon = mkp(room.qlayer, "cu-ab", '<svg width="230" height="230" viewBox="-85 -85 170 170"><circle r="80" fill="#FFF6D8" opacity=".28"/><circle r="52" fill="#FFF6D8"/><circle cx="-14" cy="-8" r="7" fill="#E8DCB8"/><circle cx="16" cy="14" r="10" fill="#E8DCB8"/></svg>', 1650, 330);
        tl.set(moon, { opacity: 0 }, 0);
        tl.fromTo(moon, { opacity: 0, scale: 0.3, y: 440 }, { opacity: 1, scale: 1, y: 330, duration: 0.9, ease: "power2.out", immediateRender: false }, w(9) - 0.2);
        tl.to(moon, { y: 310, duration: 2.0, ease: "sine.inOut" }, w(9) + 0.7);

        // ---------- camera : large -> suit Killa -> gros plan -> ciel (la lune) -> retour sur le groupe ----------
        S.camSet(room, 1560, 720, 0.76);
        S.cam(tl, room, 1500, 740, 0.9, 0, tW + 0.4, "sine.inOut");
        S.cam(tl, room, 1230, 760, 1.12, tW + 0.4, dW - 0.2, "power2.inOut");
        S.cam(tl, room, 1400, 560, 0.85, w(8) - 0.2, 1.1, "sine.inOut");
        S.cam(tl, room, 1100, 770, 1.0, w(10) - 0.4, 1.2, "power2.inOut");

        C.frame(tl, root, PLAN, { seed: 5, fadeOut: 0.3 });
        C.subs(tl, root, PLAN, {});

        window.__timelines["u10-historia-2"] = tl;
      })();
