    <script>

        S.drift(tl, room, T);
        // lumieres : par defaut ETEINTES (la ville est a oscuras) ; seules les bougies des etals respirent (cycles >= 1 s)
        var LIGHTS = Array.from(room.back.querySelectorAll(".mn-lights")), TREE = Array.from(room.back.querySelectorAll(".mn-treelights")), STAR = Array.from(room.back.querySelectorAll(".mn-star-lit"));

        // vapeur : petites bouffees qui montent (opacite <= .4, cycles finis)
        var steam = function (x, y, n, t0, span, w) {
          for (var i = 0; i < n; i++) {
            var p = mkp(room.qlayer, "puff", '<svg width="' + (w || 60) + '" height="' + (w || 60) + '" viewBox="-30 -30 60 60"><circle r="26" fill="#EAF0FF" opacity=".55"/></svg>', x + (i % 3) * 14 - 14, y);

            tl.fromTo(p, { y: y, opacity: 0, scale: 0.5 }, { y: y - 150 - (i % 2) * 30, opacity: 0.4, scale: 1.4, duration: per * 0.6, ease: "sine.out", immediateRender: false }, st);
            tl.to(p, { opacity: 0, duration: per * 0.4 - 0.01, ease: "sine.in" }, st + per * 0.6);

            }
          }

        var P = C.planOf(PLAN, 1), L1 = P.lines[0], L2 = P.lines[1];

        var qz = S.quetzal(room.actors, 1010, 800, 190, "perched", false, "qh1");
        Q.quetzalSway(tl, qz, 0.3, T - 0.5, 1);
        Q.quetzalBlink(tl, qz, 1.8); Q.quetzalBlink(tl, qz, 5.4);
        // Nacho arrive en trottinette par la droite (la trottinette glisse sous ses pieds)
        var nac = S.chr(room.actors, "nacho", 3100, 1045, 330);
        var sc = S.mk(nac.el, "", '<svg width="440" height="110" viewBox="0 0 440 110" style="overflow:visible"><rect x="20" y="8" width="400" height="22" rx="11" fill="#C9573B"/><rect x="20" y="8" width="400" height="7" rx="3" fill="#FFC83D" opacity=".8"/><circle cx="76" cy="66" r="34" fill="#2A2358"/><circle cx="76" cy="66" r="13" fill="#C9C5C0"/><circle cx="364" cy="66" r="34" fill="#2A2358"/><circle cx="364" cy="66" r="13" fill="#C9C5C0"/><path d="M360 40L392 -290" stroke="#9AA3C7" stroke-width="14" stroke-linecap="round"/><path d="M366 -292h66" stroke="#2A2358" stroke-width="16" stroke-linecap="round"/></svg>');
        sc.setAttribute("data-layout-allow-overflow", ""); sc.style.cssText = "position:absolute;left:-52px;top:" + Math.round(330 * 1.65 * 0.93) + "px;width:440px;height:110px";
        var xN = 1330;
        tl.fromTo(nac.el, { x: 3100 - nac.cx }, { x: xN - nac.cx, duration: 1.5, ease: "power2.out" }, 0);
        tl.fromTo(nac.b, { rotation: -7, transformOrigin: "50% 100%" }, { rotation: 0, duration: 1.5, ease: "power2.out" }, 0);
        S.breathe(tl, nac, 1.6, T - 1.6, 0.8); Q.charBlink(tl, nac.svg, 3.0);
        C.talkChar(tl, nac, L1); Q.charWave(tl, nac.svg, L1.t + 0.4, 1.0, "L"); Q.charEmote(tl, nac.svg, L1.t, "happy", 0.3);
        S.hop(tl, ale, 1.7, 22); S.hop(tl, mar, 1.8, 22);
        // Marina : « ¿A oscuras ? ¡Pero si es Navidad! » (surprise puis inquietude)
        C.talkChar(tl, mar, L2); Q.charEmote(tl, mar.svg, L2.t - 0.1, "worry", 0.3); Q.charEmote(tl, ale.svg, L2.t, "worry", 0.3);
        Q.charNod(tl, nac.svg, L2.t + 1.2, 5, 0.2);

        C.subs(tl, root, PLAN, {});
        window.__timelines["u06-historia-1"] = tl;
      })();
