    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var mkp = function (layer, cls, html, x, y) { var d = S.mk(layer, cls, html); d.setAttribute("data-layout-allow-overflow", ""); d.setAttribute("data-layout-ignore", ""); gsap.set(d, { x: x, y: y }); return d; };
        var P = C.planOf(PLAN, 3), L1 = P.lines[0], L2 = P.lines[1], T = PLAN.total;
        var set = Q.calleCandelaria({ uid: "cc" });
        var room = S.set($("#stage"), set, { below: "#7A5C3E", motes: 12 });
        S.drift(tl, room, T);

        // ---------- poteaux (avec lettres au départ) ; plan de la ville ----------
        var posts = set.signs.map(function (s, i) { return mkp(room.qlayer, "bgd", Q.bgSignPost({ width: s.w, uid: "sp" + i, letters: true }), s.x - s.w / 2, set.floor + 30 - Math.round(s.w * 520 / 240)); });
        mkp(room.qlayer, "bgd", Q.bgCityMap({ width: set.map.w, uid: "cm", names: false }), set.map.x, set.map.y);

        // ---------- personnages (en bas à gauche) ----------
        var ale = S.chr(room.actors, "viajero", 640, 1050, 330), mar = S.chr(room.actors, "marina", 820, 1040, 322), cam = S.chr(room.actors, "camila", 1010, 1050, 336);
        [ale, mar, cam].forEach(function (c, i) { S.breathe(tl, c, i * 0.1, T, 0.8); });
        Q.charBlink(tl, ale.svg, 2.2); Q.charBlink(tl, mar.svg, 4.1); Q.charBlink(tl, cam.svg, 3.3);
        var qz = S.quetzal(room.actors, 895, 760, 190, "perched", false, "qh3");
        Q.quetzalBlink(tl, qz, 1.7);
        [ale, mar, cam].forEach(function (c) { Q.charEmote(tl, c.svg, 0, "worry", 0.3); });

        // ---------- la Sombra, sur le toit d'en face : fumée + yeux ----------
        var tS = 0.2;
        var sb = S.mk(room.actors, "sombra"); sb.setAttribute("data-layout-allow-overflow", ""); sb.style.cssText = "position:absolute;left:0;top:0;width:440px;height:528px";
        sb.innerHTML = Q.sombra({ uid: "sb3", width: 440, height: 528, arm: true });
        sb.firstChild.style.overflow = "visible";
        var sm = S.mk(room.qlayer, "smk"); sm.setAttribute("data-layout-allow-overflow", ""); sm.style.cssText = "position:absolute;left:1650px;top:30px;width:760px;height:620px";
        gsap.set(sb, { x: 1800, y: -10, opacity: 0, transformOrigin: "50% 50%" });
        tl.fromTo(sm, { opacity: 0, scale: 0.6 }, { opacity: 0.85, scale: 1, duration: 0.8, ease: "power2.out", immediateRender: false }, tS);
        tl.fromTo(sb, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out", immediateRender: false }, tS + 0.1);
        Q.sombraFloat(tl, sb, tS + 1.0, Math.max(1, Math.floor((T - tS) / 1.6)), 1.6);
        tl.fromTo(sb.querySelectorAll(".s-eye"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, tS + 0.5);
        tl.to("#dim", { opacity: 0.22, duration: 1.2, ease: "sine.inOut" }, tS);

        // ---------- les lettres s'envolent des plaques, comme de l'encre aspirée ----------
        var NF = 12, letters = [];
        for (var i = 0; i < NF; i++) {
          var pi = i % 2, s = set.signs[pi], k = s.w / 240, row = (i >> 1) % 2;
          var sx = s.x - s.w / 2 + (50 + ((i * 29) % 140)) * k, sy = set.floor + 30 - Math.round(s.w * 520 / 240) + (row ? 208 : 100) * k;
          var f = mkp(room.actors, "flt", Q.bgLetterSvg({ width: 34 }), sx - 17, sy - 22);
          letters.push({ el: f, x: sx, y: sy, pi: pi, i: i });
        }
        var tL0 = L1.t + 0.4, tL1 = L1.t + L1.d - 0.5;
        letters.forEach(function (lt, i) {
          var t0 = tL0 + (i / (NF - 1)) * (tL1 - tL0), mx = (lt.x + 2010) / 2 + (i % 2 ? 90 : -90), my = Math.min(lt.y, 300) - 160;
          tl.set(lt.el, { opacity: 1 }, t0);
          tl.to(lt.el, { motionPath: { path: [{ x: 0, y: 0 }, { x: mx - lt.x, y: my - lt.y }, { x: 2010 - lt.x, y: 250 - lt.y }], curviness: 1.4 }, scale: 0.2, rotation: 200 + i * 20, duration: 1.0, ease: "power2.in" }, t0);
          tl.set(lt.el, { opacity: 0 }, t0 + 1.0);
        });
        posts.forEach(function (po, pi) {
          var ls = po.querySelectorAll(".bg-let");
          ls.forEach(function (g, gi) { tl.to(g, { opacity: 0, duration: 0.25, ease: "sine.in" }, tL0 + ((gi * 2 + pi) / Math.max(1, ls.length * 2)) * (tL1 - tL0)); });
        });
        // volutes d'encre autour de la Sombra
        for (var k2 = 0; k2 < 14; k2++) {
          var d = S.mk(room.actors, "dot"); d.setAttribute("data-layout-allow-overflow", "");
          var ang = (k2 / 14) * 6.283, x0 = 2000 + Math.cos(ang) * 40, y0 = 250 + Math.sin(ang) * 40;
          tl.fromTo(d, { x: x0, y: y0, scale: 0.3, opacity: 0.9 }, { x: x0 + Math.cos(ang) * (180 + (k2 % 4) * 50), y: y0 + Math.sin(ang) * (140 + (k2 % 3) * 40) - 60, scale: 1.3, opacity: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, tS + 0.1 + k2 * 0.02);
        }
        // Camila s'alarme sur « ¡Todos se pierden! »
        C.talkBounce(tl, cam.b, L2, 6); C.talkChar(tl, cam, L2);
        S.hop(tl, cam, L2.t + 0.1, 22);
        var aR = cam.svg.querySelector(".c-armR");
        tl.to(aR, { rotation: -95, svgOrigin: "258 306", duration: 0.4, ease: "back.out(1.6)" }, L2.t);
        tl.to(aR, { rotation: 0, svgOrigin: "258 306", duration: 0.5, ease: "power2.inOut" }, L2.t + L2.d);

        // ---------- caméra : les posters -> pan vers le toit de la Sombra -> recul sur le groupe ----------
        S.camSet(room, 1400, 700, 0.95);
        S.cam(tl, room, 1600, 520, 1.25, 0.1, L1.t + 1.2, "sine.inOut");
        S.cam(tl, room, 1900, 360, 1.5, L1.t + 1.3, Math.max(1.5, L1.d - 1.4), "sine.inOut");
        S.cam(tl, room, 1250, 700, 0.95, L2.t - 0.5, 1.1, "power2.inOut");

        C.frame(tl, root, PLAN, { seed: 7, fadeOut: 0.3 });
        C.subs(tl, root, PLAN, {});
        window.__timelines["u08-historia-3"] = tl;
      })();
