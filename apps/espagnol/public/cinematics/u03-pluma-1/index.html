        });
        room1.back.querySelectorAll(".fr-name").forEach(function (n, i) {

        tl.fromTo(fe, { rotation: -24 }, { rotation: 24, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, tFe);
        tl.to(fe, { x: C0.x + 500, y: C0.y - 560, scale: 0.8, rotation: 50, duration: 0.7, ease: "power2.in" }, Math.max(tFe + 1.8, W - 1.1));
        tl.to(fe, { opacity: 0, duration: 0.2 }, W - 0.55);
        for (var k = 0; k < 14; k++) {
          var sp = S.mk(room1.actors, "star", '<svg width="40" height="40" viewBox="-20 -20 40 40"><path d="' + Q.sparklePath(0, 0, 16, 4) + '" fill="#ffe9a8"/></svg>'); sp.setAttribute("data-layout-allow-overflow", "");
          var ang = (k / 14) * 6.283, sx = C0.x + Math.cos(ang) * 50, sy = C0.y + Math.sin(ang) * 50;
          tl.fromTo(sp, { x: sx, y: sy, scale: 0, opacity: 1 }, { x: sx + Math.cos(ang) * 190, y: sy + Math.sin(ang) * 190, scale: 1, duration: 0.5, ease: "back.out(3)", immediateRender: false }, tNom + 0.5 + k * 0.04);
          tl.to(sp, { scale: 0, opacity: 0, duration: 0.3 }, tNom + 1.0 + k * 0.04);
        }
        tl.fromTo("#vflash", { opacity: 0 }, { opacity: 0.55, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, tNom + 0.4);
        // Abuela : « ¡Los nombres! » (bras en l'air) puis « ¡Gracias, cariño! »

        var aR = abu.svg.querySelector(".c-armR"), aL = abu.svg.querySelector(".c-armL");
        tl.to(aR, { rotation: -150, svgOrigin: "258 306", duration: 0.35, ease: "back.out(1.8)" }, L1.t - 0.05);
        tl.to(aL, { rotation: 150, svgOrigin: "142 306", duration: 0.35, ease: "back.out(1.8)" }, L1.t - 0.05);
        tl.to([aR, aL], { rotation: 0, duration: 0.5, ease: "power2.inOut" }, L1.t + 1.7);

        S.cam(tl, room1, 1180, 470, 1.18, 0, W, "sine.inOut");

        // ============ WHIP-PAN ============
        var streaks = [];

        tl.fromTo("#p1", { x: 0, skewX: 0 }, { x: -2300, skewX: -16, duration: 0.34, ease: "power3.in", immediateRender: false }, W - 0.24);
        tl.set("#p1", { visibility: "hidden" }, W + 0.2);
        tl.set("#p2", { visibility: "visible" }, W - 0.2);
        tl.fromTo("#p2", { x: 2300, skewX: 16 }, { x: 0, skewX: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, W - 0.16);
        streaks.forEach(function (sk, i) { tl.fromTo(sk, { x: 1700 + i * 90, opacity: 0.9, scaleX: 0.4 }, { x: -900, opacity: 0, scaleX: 1.6, duration: 0.42, ease: "power2.in", immediateRender: false }, W - 0.22 + i * 0.012); });

        var set2 = Q.patioAndaluz({ uid: "pa" });

        S.drift(tl, room2, T - W + 0.4, W - 0.1); S.fountain(tl, room2, T - W + 0.4, W - 0.1);
        var QW = 330;

        qz.querySelectorAll(".q-tail").forEach(function (t) { gsap.set(t, { scale: 0.85, svgOrigin: t.dataset.px + " " + t.dataset.py }); });
        // trajectoire : arrivee par la gauche, boucle autour de la fontaine, atterrissage sur la vasque du haut
        var path = [{ x: 200, y: 700 }, { x: 560, y: 380 }, { x: 980, y: 300 }, { x: 1560, y: 420 }, { x: 1700, y: 700 }, { x: 1300, y: 860 }, { x: 760, y: 800 }, { x: 600, y: 520 }, { x: 960, y: 360 }, { x: 1180, y: 520 }];

        tl.to(qz, { motionPath: { path: path, curviness: 1.4, autoRotate: false }, duration: tLand - tF0, ease: "sine.inOut" }, tF0);
        Q.quetzalFlap(tl, qz, tF0, Math.floor((tLand - tF0) / 0.32), 0.32, 0.9);
        Q.quetzalPoseTo(tl, qz, "talk", tLand - 0.1, 0.5, "power2.out");
        C.talkQuetzal(tl, qz, L2);
        Q.quetzalBlink(tl, qz, W + 1.4);
        // sillage d'etincelles vertes
        for (var z = 0; z < 16; z++) {

          var tz = tF0 + 0.2 + z * ((tLand - tF0) / 17), pi = Math.min(path.length - 1, Math.floor((z / 16) * path.length)), pp = path[pi];
