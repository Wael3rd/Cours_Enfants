    <script>
      (function () {

        var map = mkp(room.qlayer, "bgd", Q.bgCityMap({ width: set.map.w, uid: "cm", names: false }), set.map.x, set.map.y);
        var rings = [0, 1].map(function (i) { return mkp(room.qlayer, "ring", "", set.signs[i].x, 560); });
        var ringM = mkp(room.qlayer, "ring", "", set.map.x + set.map.w / 2, set.map.y + set.map.h / 2);
        var tSign = C.wordT(PLAN, 2, 1, 6), tMap = C.wordT(PLAN, 2, 1, 12);

        });
        tl.fromTo(ringM, { opacity: 0, scale: 0.4 }, { opacity: 0.95, scale: 2.4, duration: 0.5, ease: "back.out(1.8)", immediateRender: false }, tMap - 0.1);
        tl.to(ringM, { opacity: 0, scale: 3, duration: 0.5, ease: "power2.in" }, tMap + 0.9);
        tl.to(map, { rotation: 1.4, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: C.reps(T, 2.2) + 1, transformOrigin: "50% 0%" }, 0);

        // ---------- Alex, Marina (+ Quetzal), Camila ----------

        // Camila montre les panneaux puis le plan (bras tendu)
        var aR = cam.svg.querySelector(".c-armR"), aL = cam.svg.querySelector(".c-armL");
        tl.to(aL, { rotation: 70, svgOrigin: "142 306", duration: 0.45, ease: "back.out(1.6)" }, tSign - 0.1);
        tl.to(aL, { rotation: 0, svgOrigin: "142 306", duration: 0.5, ease: "power2.inOut" }, tSign + 1.3);
        tl.to(aR, { rotation: -75, svgOrigin: "258 306", duration: 0.45, ease: "back.out(1.6)" }, tMap - 0.1);
        tl.to(aR, { rotation: 0, svgOrigin: "258 306", duration: 0.5, ease: "power2.inOut" }, tMap + 1.2);
        // Marina pose la question
        C.talkChar(tl, mar, L2); Q.charEmote(tl, mar.svg, L2.t, "worry", 0.25);

        S.breathe(tl, her, 0, 1, 0.8); S.breathe(tl, mrt, 0, 1, 0.8);

        var loop = function (ch, xs, t0, dur) {

          for (var i = 0; i < xs.length - 1; i++) {
