    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var mkp = function (layer, cls, html, x, y) { var d = S.mk(layer, cls, html); d.setAttribute("data-layout-allow-overflow", ""); d.setAttribute("data-layout-ignore", ""); gsap.set(d, { x: x, y: y }); return d; };

        var set = Q.calleCandelaria({ uid: "cc" });

        S.drift(tl, room, T);

        // ---------- poteaux de rue : les plaques sont vides (aucune lettre) ----------
        set.signs.forEach(function (s, i) { mkp(room.qlayer, "bgd", Q.bgSignPost({ width: s.w, uid: "sp" + i, letters: false }), s.x - s.w / 2, set.floor + 30 - Math.round(s.w * 520 / 240)); });

        var flag = mkp(room.qlayer, "bgd", Q.bgCityMap({ width: 300, uid: "cm", names: false }), 2480, 360);
        tl.to(flag, { rotation: 1.2, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: C.reps(T, 2.4) + 1, transformOrigin: "50% 0%" }, 0);

        // ---------- Alex et Marina dans la rue ; le Quetzal sort du sac ----------
        var ale = S.chr(room.actors, "viajero", 700, 1040, 330), mar = S.chr(room.actors, "marina", 880, 1030, 322);
        S.breathe(tl, ale, 0.1, T, 0.8); S.breathe(tl, mar, 0.2, T, 0.8);
        Q.charBlink(tl, ale.svg, 2.4); Q.charBlink(tl, mar.svg, 3.9);
        var qz = S.quetzal(room.actors, 975, 770, 200, "perched", false, "qh1");
        var tQ = L1.t - 0.25;
        gsap.set(qz, { opacity: 0, scale: 0.2, x: 0, y: 0, transformOrigin: "50% 80%" });
        tl.fromTo(qz, { opacity: 0, scale: 0.2, y: 30 }, { opacity: 1, scale: 1, y: -70, duration: 0.55, ease: "back.out(1.8)", immediateRender: false }, tQ);
        Q.quetzalPoseTo(tl, qz, "fly", tQ, 0.35);
        Q.quetzalFlap(tl, qz, tQ + 0.2, 5, 0.38, 0.8);
        tl.to(qz, { y: -150, x: 30, duration: 0.9, ease: "sine.inOut" }, tQ + 0.6);
        C.talkQuetzal(tl, qz, L1);
        var tEnd1 = L1.t + L1.d;
        tl.to(qz, { x: 0, y: -8, duration: 0.7, ease: "power2.inOut" }, tEnd1 + 0.05);
        Q.quetzalPoseTo(tl, qz, "perched", tEnd1 + 0.1, 0.5);
        Q.quetzalBlink(tl, qz, tEnd1 + 0.9);
        Q.charEmote(tl, mar.svg, tQ, "happy", 0.3); Q.charEmote(tl, ale.svg, tQ, "happy", 0.3);

        // ---------- Camila arrive en courant par la droite (ruana rouge) ----------
        var cam = S.chr(room.actors, "camila", 3100, 1040, 336);
        var tR = tEnd1 - 0.35, dR = 1.5, xM = 1280;
        S.walk(tl, cam, 3100, xM, tR, dR, 0.24, "power1.out");
        S.breathe(tl, cam, tR + dR, T - tR - dR, 0.8);
        tl.fromTo(cam.b, { scaleX: 1, scaleY: 1 }, { scaleX: 1.06, scaleY: 0.95, duration: 0.12, ease: "power2.in", transformOrigin: "50% 100%", immediateRender: false }, tR + dR - 0.05);
        tl.to(cam.b, { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1,0.45)" }, tR + dR + 0.08);
        C.talkBounce(tl, cam.b, L2, 6); C.talkChar(tl, cam, L2);
        Q.charWave(tl, cam.svg, L2.t - 0.1, 0.9, "R");               // « ¡Hola! »
        Q.charEmote(tl, cam.svg, L2.t, "happy", 0.3);
        S.hop(tl, ale, L2.t + 3.2, 26); Q.charNod(tl, mar.svg, L2.t + 3.6, 4, 0.2);
        Q.charBlink(tl, cam.svg, L2.t + 2.6);

        S.cam(tl, room, 1180, 760, 0.95, 0, tR + 0.5, "sine.inOut");
        S.cam(tl, room, 1230, 770, 1.1, tR + 0.3, 1.5, "power2.inOut");
        tl.fromTo("#stage", { rotation: -0.8, transformOrigin: "50% 50%" }, { rotation: 0, duration: 1.4, ease: "power2.out" }, 0);

        C.frame(tl, root, PLAN, { seed: 5, fadeOut: 0.3 });
