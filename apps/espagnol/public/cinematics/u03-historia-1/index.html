    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var P = C.planOf(PLAN, 1), L1 = P.lines[0], L2 = P.lines[1], T = PLAN.total;
        var set = Q.callejonTriana({ uid: "ct" });
        var room = S.set($("#stage"), set, { below: "#6B4A2A", motes: 26 });
        S.drift(tl, room, T);
        var D = set.door, FL = 900, DW = D.w, DH = D.h + 40, MID = D.x + D.w / 2;

        // ---------- la porte bleue : interieur chaud + deux battants qui vont s'ouvrir ----------
        var inner = S.mk(room.qlayer, "", '<svg width="' + DW + '" height="' + DH + '" viewBox="0 0 ' + DW + ' ' + DH + '"><defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE6A8"/><stop offset="1" stop-color="#E8964A"/></linearGradient></defs><path d="M0 ' + DH + 'V' + (DW / 2) + 'A' + (DW / 2) + ' ' + (DW / 2) + ' 0 0 1 ' + DW + ' ' + (DW / 2) + 'V' + DH + 'Z" fill="url(#dg)"/><g fill="#5FB06A"><circle cx="30" cy="' + (DH - 40) + '" r="26"/><circle cx="' + (DW - 34) + '" cy="' + (DH - 30) + '" r="30"/></g><g fill="#D81E3A"><circle cx="30" cy="' + (DH - 56) + '" r="8"/><circle cx="' + (DW - 40) + '" cy="' + (DH - 52) + '" r="9"/></g><path d="M0 ' + (DH - 8) + 'H' + DW + '" stroke="#C9573B" stroke-width="16"/></svg>');
        inner.style.cssText = "position:absolute;left:" + D.x + "px;top:" + (FL - DH) + "px;width:" + DW + "px;height:" + DH + "px"; inner.setAttribute("data-layout-allow-overflow", "");
        var lL = S.mk(room.actors, "leaf"), lR = S.mk(room.actors, "leaf");
        [lL, lR].forEach(function (l) { l.setAttribute("data-layout-allow-overflow", ""); l.style.width = DW / 2 + "px"; l.style.height = DH - DW / 2 + 40 + "px"; });
        lL.style.cssText += ";left:" + D.x + "px;top:" + (FL - DH + DW / 2 - 40) + "px;border-top-left-radius:" + (DW / 2) + "px;transform-origin:0 50%";
        lR.style.cssText += ";left:" + (D.x + DW / 2) + "px;top:" + (FL - DH + DW / 2 - 40) + "px;border-top-right-radius:" + (DW / 2) + "px;transform-origin:100% 50%";
        // le haut des battants suit l'arc : on masque l'espace sous l'arc par la forme ci-dessus ; on cache les battants tant que la porte n'est pas ouverte (la porte du decor reste visible)
        tl.set([lL, lR], { opacity: 0 }, 0);
        var abu = S.chr(room.actors, "abuela_carmen", MID, FL + 6, 250);
        gsap.set(abu.el, { opacity: 0 });
        var dg = S.mk(room.actors, "dglow"); dg.style.cssText += ";width:560px;height:560px"; dg.setAttribute("data-layout-allow-overflow", ""); gsap.set(dg, { x: MID - 280, y: FL - 340 });

        // ---------- Marina court vers la porte, Alex la suit ----------
        var MX0 = 260, MX1 = 2380, mar = S.chr(room.actors, "marina", MX0, 1010, 330);
        var ale = S.chr(room.actors, "viajero", -120, 1030, 340);
        var tStop = L1.t + L1.d - 0.15;
        S.walk(tl, mar, MX0, MX1, 0, tStop, 0.26, "power1.inOut");
        S.walk(tl, ale, -120, 2090, 0.35, tStop - 0.2, 0.27, "power1.inOut");
        C.talkBounce(tl, mar.b, L1, 6); C.talkChar(tl, mar, L1);
        tl.to(mar.b, { scaleX: 1.07, scaleY: 0.94, duration: 0.12, ease: "power2.in", transformOrigin: "50% 100%" }, tStop - 0.1);
        tl.to(mar.b, { scaleX: 1, scaleY: 1, duration: 0.4, ease: "elastic.out(1,0.45)" }, tStop + 0.05);
        // elle tape a la porte / fait signe (« ¡Abuela! »)
        Q.charWave(tl, mar.svg, tStop + 0.0, 0.5, "R");
        S.breathe(tl, mar, tStop + 0.5, T - tStop, 0.8); S.breathe(tl, ale, tStop + 0.1, T - tStop, 0.8);
        Q.charBlink(tl, ale.svg, 5.2);

        // ---------- la porte s'ouvre, Abuela Carmen apparait bras ouverts ----------
        var tOp = L1.t + L1.d + 0.1;
        tl.fromTo(dg, { opacity: 0, scale: 0.4 }, { opacity: 0.95, scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, tOp);
        tl.set([lL, lR], { opacity: 1 }, tOp);
        tl.fromTo(lL, { scaleX: 1, skewY: 0 }, { scaleX: 0.14, skewY: -9, duration: 0.55, ease: "power2.out", immediateRender: false }, tOp);
        tl.fromTo(lR, { scaleX: 1, skewY: 0 }, { scaleX: 0.14, skewY: 9, duration: 0.55, ease: "power2.out", immediateRender: false }, tOp);
        tl.to(dg, { opacity: 0.45, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3 }, tOp + 0.6);
        tl.fromTo(abu.el, { opacity: 0, x: 0 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, tOp + 0.2);
        C.talkBounce(tl, abu.b, L2, 5); C.talkChar(tl, abu, L2);
        tl.to(abu.svg.querySelector(".c-armL"), { rotation: 72, svgOrigin: "142 306", duration: 0.4, ease: "back.out(1.6)" }, L2.t - 0.05);
        tl.to(abu.svg.querySelector(".c-armR"), { rotation: -72, svgOrigin: "258 306", duration: 0.4, ease: "back.out(1.6)" }, L2.t - 0.05);
        Q.charEmote(tl, abu.svg, L2.t, "happy", 0.3);
        // elle s'avance d'un pas, Marina bondit de joie
        tl.to(abu.el, { x: -60, duration: 0.8, ease: "power2.out" }, L2.t + 0.1);
        S.hop(tl, mar, L2.t + 1.6, 50);
        Q.charEmote(tl, mar.svg, L2.t, "happy", 0.3);

        // ---------- camera : suivi a hauteur d'enfant, puis recadrage sur le couple ----------
        S.camSet(room, 760, 790, 1.1);
        S.cam(tl, room, 2300, 790, 1.1, 0.0, tStop + 0.1, "power1.inOut");
        S.cam(tl, room, 2420, 760, 1.28, tOp - 0.1, 1.2, "power2.inOut");
        tl.fromTo("#stage", { rotation: 0.9, transformOrigin: "50% 50%" }, { rotation: 0, duration: 1.2, ease: "power2.out" }, 0);

        C.frame(tl, root, PLAN, { seed: 5, fadeOut: 0.3 });
        C.subs(tl, root, PLAN, {});

        window.__timelines["u03-historia-1"] = tl;
      })();
