    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine;
        gsap.registerPlugin(MotionPathPlugin);
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var $ = function (s) { return document.querySelector(s); };
        var P2 = C.planOf(PLAN, 2), T = PLAN.total;
        var mk = function (parent, cls, html) { var d = document.createElement("div"); d.className = cls; d.setAttribute("data-layout-allow-overflow", ""); if (html != null) d.innerHTML = html; parent.appendChild(d); return d; };

        // ============================ panorama de Cusco a l'heure doree ============================
        var sky = Q.cuscoSkyline({ uid: "cu" });
        $("#skyL").innerHTML = sky.sky; $("#sunL").innerHTML = sky.sun; $("#farL").innerHTML = sky.far; $("#midL").innerHTML = sky.mid; $("#nearL").innerHTML = sky.near;
        var span = T, t0 = 0;
        tl.fromTo("#skyL", { x: 0 }, { x: -300, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#sunL", { x: 0 }, { x: -520, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#farL", { x: 0 }, { x: -660, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#midL", { x: 0 }, { x: -1000, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#nearL", { x: 0 }, { x: -1280, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#motes", { x: 0 }, { x: -520, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#p2", { scale: 1.06, transformOrigin: "50% 60%" }, { scale: 1.0, duration: span, ease: "sine.out" }, t0);
        var rays2 = $("#sunL .sk-rays");
        tl.fromTo(rays2, { rotation: 0, svgOrigin: rays2.dataset.px + " " + rays2.dataset.py }, { rotation: 22, svgOrigin: rays2.dataset.px + " " + rays2.dataset.py, duration: span, ease: "none" }, t0);
        tl.fromTo("#sunL .sk-disc", { scale: 0.97, svgOrigin: sky.sunX + " " + sky.sunY }, { scale: 1.03, svgOrigin: sky.sunX + " " + sky.sunY, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.8) }, t0);
        document.querySelectorAll("#skyL .m-cloud").forEach(function (c, i) { tl.to(c, { x: 60 + (i % 3) * 40, duration: span, ease: "none" }, t0); });
        // le nuage qui cache Machu Picchu respire lentement
        document.querySelectorAll("#farL .cu-mpcloud").forEach(function (c) { tl.fromTo(c, { x: -20 }, { x: 50, duration: span, ease: "sine.inOut" }, t0); });
        // fenetres allumees qui scintillent doucement
        document.querySelectorAll("#midL svg rect[fill='#FFD98A']").forEach(function (r, i) { if (i % 5 === 0) tl.to(r, { opacity: 0.35, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0 + 0.4 + (i % 7) * 0.5); });
        // poussiere doree
        $("#motes").innerHTML = Q.moteField({ n: 40, w: 2400, h: 1200, seed: 9, rmin: 2, rmax: 6, stars: true });
        document.querySelectorAll("#motes .k-mote").forEach(function (m, i) {
          var x = +m.dataset.x, y = +m.dataset.y;
          tl.fromTo(m, { x: x, y: y, opacity: 0 }, { x: x + 40 - (i % 5) * 20, y: y - 160 - (i % 7) * 30, opacity: 0.9, duration: span * 0.5, ease: "sine.out" }, t0 + (i % 9) * 0.1);
          tl.to(m, { opacity: 0, duration: span * 0.5, ease: "sine.in" }, t0 + span * 0.5 + (i % 9) * 0.1);
        });
        // trois condors qui planent lentement (ailes qui battent ~1,2 s, tres peu)
        for (var bI = 0; bI < 3; bI++) {
          var bd = mk($("#p2"), "bird", Q.cuCondor({ width: 330 - bI * 60 })); bd.setAttribute("data-layout-ignore", "");
          bd.querySelector("svg").style.overflow = "visible";
          $("#p2").insertBefore(bd, $("#nearL"));
          var by = 190 + bI * 120, bx0 = 2050 + bI * 760, per = 1.15 + bI * 0.2;
          tl.fromTo(bd, { x: bx0, y: by }, { x: bx0 - 2900, y: by + 60 - bI * 50, duration: span + 1.0, ease: "none" }, t0 - 0.3);
          ["L", "R"].forEach(function (sd) {
            var wg = bd.querySelector(".cu-cd-wing" + sd), sg = sd === "L" ? 1 : -1;
            tl.fromTo(wg, { rotation: -12 * sg, svgOrigin: "230 78" }, { rotation: 12 * sg, svgOrigin: "230 78", duration: per, ease: "sine.inOut", yoyo: true, repeat: C.reps(span + 1.0, per) + 1 }, t0 - 0.3);
          });

        chip.innerHTML = '<svg width="46" height="58" viewBox="0 0 46 58"><path d="M23 56C6 36 4 28 4 22a19 19 0 1 1 38 0c0 6-2 14-19 34Z" fill="#d93472" stroke="#fff3d1" stroke-width="4"/><circle cx="23" cy="22" r="7" fill="#fff3d1"/></svg><b>CUSCO, PERÚ</b>';

        tl.to(chip, { x: -760, opacity: 0, duration: 0.4, ease: "power3.in" }, P2.t1 - 0.5);

        C.frame(tl, root, PLAN, { seed: 19 });
        C.subs(tl, root, PLAN, {});

        window.__timelines["u10-intro-2"] = tl;
      })();
