    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine, S = window.QStage;
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var P = C.planOf(PLAN, 3), L1 = P.lines[0], L2 = P.lines[1], T = PLAN.total;
        var $ = function (s) { return document.querySelector(s); };

        // ---------- decor : Ignacio devant la carte, le Quetzal triste sur le bureau ----------
        var room = S.room($("#stage"));
        var ign = S.chr(room.actors, "ignacio", 1360, 1015, 380);
        var QX = 2030, QY = 792;
        var qz = S.quetzal(room.qlayer, QX, QY, 400, "sad", true, "q3");
        S.ambience(tl, room, T);
        S.breathe(tl, ign, 0, T);
        S.camSet(room, 1480, 600, 1.34);

        // ---------- camera : dolly lent vers la droite (la carte), puis push-in sur le Quetzal a la supplique ----------
        S.cam(tl, room, 1560, 630, 1.5, 0, L1.t + L1.d, "sine.inOut");
        S.cam(tl, room, 1720, 650, 1.76, L2.t - 0.3, T - (L2.t - 0.3), "power2.inOut");
        tl.fromTo("#stage", { rotation: 1.0, transformOrigin: "50% 50%" }, { rotation: 0, duration: 2.0, ease: "power2.out" }, 0);

        // ---------- ambiance : la lumiere baisse, tout vire au magenta quand l'ombre passe ----------
        tl.to("#dim", { opacity: 1, duration: 1.0, ease: "power2.inOut" }, L1.words[0].t + 0.2);
        tl.to("#tint", { opacity: 1, duration: 0.8, ease: "power2.inOut" }, L1.words[3].t);
        tl.to("#dim", { opacity: 0.5, duration: 1.2, ease: "sine.inOut" }, L2.t - 0.2);
        tl.to("#tint", { opacity: 0.25, duration: 1.2, ease: "sine.inOut" }, L2.t - 0.2);
        room.back.querySelectorAll(".ac-lamp-glow").forEach(function (g, i) { tl.to(g, { opacity: 0.08, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, L1.words[3].t + i * 0.18); });

        // ---------- la Sombra du Silencio glisse sur la carte (silhouette de fumee, yeux magenta) ----------
        var sh = S.mk(room.mid, "sombra"); sh.setAttribute("data-layout-allow-overflow", "");
        sh.style.cssText = "position:absolute;left:0;top:0;width:760px;height:912px;filter:drop-shadow(0 0 40px rgba(255,90,170,1)) drop-shadow(0 0 8px rgba(255,200,240,.9))";
        sh.innerHTML = Q.sombra({ uid: "sb3", width: 760, height: 912, arm: true });
        var sT = L1.words[3].t - 0.1, sD = 3.4, X0 = 1000, X1 = 1900;
        gsap.set(sh, { x: X0, y: 60, opacity: 0, scale: 1.0 });
        tl.to(sh, { x: X1, y: 90, opacity: 1, scale: 1.1, duration: sD, ease: "none" }, sT);
        tl.to(sh, { opacity: 0, duration: 0.7, ease: "power2.in" }, sT + sD - 0.5);
        Q.sombraFloat(tl, sh, sT, 2, 1.6);
        Q.sombraEyes(tl, sh, sT, "open", 0.4);
        // les plumes-points de la carte s'eteignent quand l'ombre passe dessus
        room.back.querySelectorAll(".ac-feather").forEach(function (f) {
          var m = f.transform.baseVal.getItem(0).matrix, fx = m.e, fy = m.f;
          var tPass = sT + (Math.min(Math.max(fx + 100 - X0, 0), X1 - X0) / (X1 - X0)) * sD;
          tl.to(f, { opacity: 0.08, scale: 0.4, svgOrigin: fx + " " + fy, duration: 0.3, ease: "power2.in" }, tPass - 0.3);
          tl.to(f, { opacity: 0.55, scale: 0.8, svgOrigin: fx + " " + fy, duration: 0.8, ease: "sine.out" }, tPass + 1.4);
        });

        // ---------- Ignacio inquiet : il explique ----------
        C.talkBounce(tl, ign.b, L1, 5); C.talkChar(tl, ign, L1, 2.2);
        Q.charEmote(tl, ign.svg, L1.t, "worry", 0.5);
        var armL = ign.svg.querySelector(".c-armL"), armR = ign.svg.querySelector(".c-armR");
        tl.to(armL, { rotation: 38, svgOrigin: "142 306", duration: 0.45, ease: "back.out(1.4)" }, L1.words[3].t);
        tl.to(armL, { rotation: 52, svgOrigin: "142 306", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, L1.words[3].t + 0.45);
        tl.to(armL, { rotation: 0, svgOrigin: "142 306", duration: 0.5, ease: "power2.inOut" }, L2.t - 0.2);
        tl.to(armR, { rotation: -22, svgOrigin: "258 306", duration: 0.45, ease: "back.out(1.4)" }, L1.words[9].t);
        tl.to(armR, { rotation: 0, svgOrigin: "258 306", duration: 0.5, ease: "power2.inOut" }, L2.t - 0.2);
        tl.to(ign.b, { x: -18, rotation: -3, duration: 0.5, ease: "sine.inOut" }, L1.words[3].t);
        tl.to(ign.b, { x: 0, rotation: 0, duration: 0.6, ease: "power2.inOut" }, L2.t);
        Q.charBlink(tl, ign.svg, 2.3); Q.charBlink(tl, ign.svg, 6.0);
        Q.charNod(tl, ign.svg, L2.t + L2.d - 0.2, 5, 0.25);

        // ---------- le Quetzal supplie ----------
        Q.quetzalSway(tl, qz, 0.5, 2.4, 0.5);
        Q.quetzalBlink(tl, qz, 1.9); Q.quetzalBlink(tl, qz, 4.6);
        tl.fromTo(qz, { x: 0 }, { x: 4, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.4);
        Q.quetzalPoseTo(tl, qz, "talk", L2.t - 0.15, 0.4, "power2.out");
        C.talkQuetzal(tl, qz, L2);
        tl.to(qz, { y: -22, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, L2.words[0].t);
        tl.to(qz, { y: -22, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, L2.words[2].t);
        Q.quetzalFlap(tl, qz, L2.t + 0.2, 2, 0.4, 0.45);

        // ---------- cadre + sous-titres ----------
        C.frame(tl, root, PLAN, { seed: 3, fadeOut: 0.3 });
        C.subs(tl, root, PLAN, {});
        window.__timelines["u01-historia-3"] = tl;
      })();
