    <script>
      (function () {
        var PLAN = window.PLAN, Q = window.QArt, C = window.QCine;
        var tl = gsap.timeline({ paused: true });
        var root = document.getElementById("root");
        C.initPlayer();
        var P1 = C.planOf(PLAN, 1), P2 = C.planOf(PLAN, 2), W = P2.t0;
        var rot = (PLAN.meta.rotulo || "Capítulo 1 · ¡Hola! · Madrid").split(" · ");
        var $ = function (s) { return document.querySelector(s); };

        // ============================ PLAN 1 : la carte ============================
        var mapbox = $("#mapbox");
        mapbox.innerHTML = Q.worldMap({ uid: "wm", states: { madrid: "current", salamanca: "open", sevilla: "open", valencia: "open" }, player: "madrid", initial: C.player.name.charAt(0).toUpperCase() });
        C.nameHooks.push(function (n) { var t = mapbox.querySelector(".m-token text"); if (t) t.textContent = n.charAt(0).toUpperCase(); });

        tl.fromTo(mapbox, { rotation: -2.5, transformOrigin: "50% 50%" }, { rotation: 0, duration: 2.4, ease: "power2.out" }, 0.1);
        Q.mapFogDrift(tl, mapbox, 0, W + 0.2);
        Q.mapPulse(tl, mapbox, 1.6, 4, 0.9);
        tl.to(mapbox, { scale: 1.05, transformOrigin: "50% 30%", duration: W - 2.4, ease: "sine.inOut" }, 2.4);
        // le pion saute quand on arrive
        tl.fromTo(mapbox.querySelector(".m-token"), { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.0);
        tl.to(mapbox.querySelector(".m-plq-madrid"), { opacity: 0, duration: 0.3 }, tK - 0.1);

        // carte-titre (affiche de voyage)
        var tc = $("#tc");
        var tile = Q.azulejoDataUri({ a: "#1d2160", b: "#19b7aa", c: "#ffc83d" }, 40);
        tc.innerHTML = '<div class="tcbox"><div class="band t" style="background-image:url(\'' + tile + '\')"></div><div class="band b" style="background-image:url(\'' + tile + '\')"></div></div>' +
          '<div class="tc-kicker">' + rot[0].toUpperCase() + '</div><div class="tc-hola">' + (rot[1] || "¡Hola!").toUpperCase() + '</div><div class="tc-city">' + (rot[2] || "Madrid").toUpperCase() + '</div>';
        // rayons derriere la carte
        var rays = ""; for (var i = 0; i < 16; i++) { var a = (i / 16) * Math.PI * 2, b = a + Math.PI / 20; rays += '<path d="M700 700L' + (700 + Math.cos(a) * 760).toFixed(1) + " " + (700 + Math.sin(a) * 760).toFixed(1) + "L" + (700 + Math.cos(b) * 760).toFixed(1) + " " + (700 + Math.sin(b) * 760).toFixed(1) + 'Z"/>'; }
        $("#rays").innerHTML = '<svg width="1400" height="1400" viewBox="0 0 1400 1400"><g fill="#ffd76a" opacity=".42">' + rays + "</g></svg>";
        // confettis de papel picado (positions deterministes)
        var rnd = Q.rng(21), cols = ["#d93472", "#ffc83d", "#19b7aa", "#c9573b", "#0e9f6e", "#ff9f1c"], cfs = [];
        for (var k = 0; k < 44; k++) { var d = document.createElement("div"); d.className = "cf"; d.setAttribute("data-layout-allow-overflow", ""); d.style.background = cols[k % cols.length]; $("#p1").insertBefore(d, $("#flash")); cfs.push(d); }

        var tK = C.wordT(PLAN, 1, 1, 1), tH = C.wordT(PLAN, 1, 1, 3);
        tl.set(tc, { opacity: 0 }, 0);
        tl.set(mapbox.parentNode.querySelector("#mapdim"), { opacity: 0 }, 0);
        tl.to("#mapdim", { opacity: 0.55, duration: 0.5, ease: "power2.out" }, tH - 0.35);
        tl.fromTo(tc, { opacity: 0, y: 90, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, tK + 0.1);
        tl.set(".tc-hola, .tc-city", { opacity: 0 }, 0);
        tl.fromTo(".tcbox", { scaleY: 0.05, opacity: 0, transformOrigin: "50% 50%" }, { scaleY: 1, opacity: 1, duration: 0.42, ease: "back.out(1.4)" }, tH - 0.12);
        tl.fromTo(".tc-kicker", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, tK + 0.1);
        // ¡HOLA! claque
        tl.fromTo(".tc-hola", { opacity: 0, scale: 2.6, rotation: -7, transformOrigin: "50% 60%" }, { opacity: 1, scale: 1, rotation: -2, duration: 0.5, ease: "expo.out" }, tH - 0.02);
        tl.fromTo("#flash", { opacity: 0.75 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, tH);
        tl.fromTo("#rays", { opacity: 0, scale: 0.3, rotation: -20 }, { opacity: 0.55, scale: 1, rotation: 0, duration: 0.7, ease: "expo.out" }, tH - 0.02);
        tl.to("#rays", { rotation: 24, duration: W - tH, ease: "none" }, tH + 0.7);
        tl.to("#p1", { keyframes: [{ x: -16, duration: 0.05 }, { x: 14, duration: 0.05 }, { x: -9, duration: 0.05 }, { x: 5, duration: 0.05 }, { x: 0, duration: 0.06 }], ease: "power1.inOut" }, tH);
        tl.fromTo(".tc-city", { opacity: 0, clipPath: "polygon(0 0, 0 0, 0 50%, 0 100%, 0 100%, 0 50%)", x: -40 }, { opacity: 1, clipPath: "polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%)", x: 0, duration: 0.45, ease: "power3.out" }, tH + 0.32);
        tl.to("#tc", { y: -10, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, tH + 0.6);
        cfs.forEach(function (c, i) {
          var ang = rnd() * Math.PI * 2, dist = 380 + rnd() * 560, x1 = 960 + Math.cos(ang) * dist, y1 = 480 + Math.sin(ang) * dist * 0.7;
          var t0 = tH + 0.04 + rnd() * 0.06;
          tl.fromTo(c, { x: 960, y: 520, opacity: 1, scale: 0.4 + rnd() * 0.8, rotation: 0 }, { x: x1, y: y1, rotation: (rnd() - 0.5) * 540, duration: 0.55, ease: "expo.out", immediateRender: false }, t0);
          tl.to(c, { y: y1 + 520 + rnd() * 200, x: x1 + (rnd() - 0.5) * 160, rotation: "+=" + ((rnd() - 0.5) * 360), opacity: 0, duration: 1.5 + rnd() * 0.4, ease: "power1.in" }, t0 + 0.5);
        });
        // plus de lumiere : etincelles autour de la carte-titre
        for (var s = 0; s < 8; s++) {
          var sp = document.createElement("div"); sp.className = "spark"; sp.setAttribute("data-layout-allow-overflow", ""); sp.innerHTML = '<svg width="60" height="60" viewBox="-30 -30 60 60"><path d="' + Q.sparklePath(0, 0, 26, 6) + '" fill="#fff3d1"/></svg>'; $("#p1").insertBefore(sp, $("#flash"));
          var sx = 220 + rnd() * 1480, sy = 130 + rnd() * 560, st = tH + 0.25 + s * 0.12;
          tl.fromTo(sp, { x: sx, y: sy, scale: 0, rotation: 0, opacity: 1 }, { scale: 0.6 + rnd() * 0.7, rotation: 90, duration: 0.3, ease: "back.out(3)" }, st);
          tl.to(sp, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in" }, st + 0.35);
        }

        // ============================ WHIP-PAN vers le plan 2 ============================
        var streaks = [];
        for (var q = 0; q < 7; q++) { var sk = document.createElement("div"); sk.className = "streak"; sk.setAttribute("data-layout-allow-overflow", ""); sk.style.top = 140 + q * 150 + (q % 2) * 40 + "px"; root.appendChild(sk); streaks.push(sk); }
        tl.fromTo("#p1", { x: 0, skewX: 0 }, { x: -2300, skewX: -16, duration: 0.34, ease: "power3.in", immediateRender: false }, W - 0.24);
        tl.set("#p1", { visibility: "hidden" }, W + 0.2);
        tl.set("#p2", { visibility: "visible" }, W - 0.2);
        tl.fromTo("#p2", { x: 2300, skewX: 16 }, { x: 0, skewX: 0, duration: 0.5, ease: "power3.out" }, W - 0.16);
        streaks.forEach(function (sk, i) {
          tl.fromTo(sk, { x: 1700 + i * 90, opacity: 0.9, scaleX: 0.4 }, { x: -900, opacity: 0, scaleX: 1.6, duration: 0.42, ease: "power2.in", immediateRender: false }, W - 0.22 + i * 0.012);
        });

        // ============================ PLAN 2 : Madrid au coucher du soleil ============================
        var sky = Q.madridSkyline({ uid: "sk" });
        $("#skyL").innerHTML = sky.sky; $("#sunL").innerHTML = sky.sun; $("#farL").innerHTML = sky.far; $("#midL").innerHTML = sky.mid; $("#nearL").innerHTML = sky.near;
        var span = P2.t1 - P2.t0 + 0.3, t0 = P2.t0 - 0.1;
        // travelling lateral lent : calques a des vitesses differentes (parallaxe)
        tl.fromTo("#skyL", { x: 0 }, { x: -120, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#sunL", { x: 0 }, { x: -160, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#farL", { x: 0 }, { x: -320, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#midL", { x: 0 }, { x: -700, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#nearL", { x: 0 }, { x: -1280, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#motes", { x: 0 }, { x: -520, duration: span, ease: "power1.inOut" }, t0);
        tl.fromTo("#p2", { scale: 1.06, transformOrigin: "50% 60%" }, { scale: 1.0, duration: span, ease: "sine.out" }, t0);
        // le soleil respire, ses rayons tournent
        var rays2 = $("#sunL .sk-rays");
        tl.fromTo(rays2, { rotation: 0, svgOrigin: rays2.dataset.px + " " + rays2.dataset.py }, { rotation: 22, svgOrigin: rays2.dataset.px + " " + rays2.dataset.py, duration: span, ease: "none" }, t0);
        tl.fromTo("#sunL .sk-disc", { scale: 0.97, svgOrigin: sky.sunX + " " + sky.sunY }, { scale: 1.03, svgOrigin: sky.sunX + " " + sky.sunY, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: C.reps(span, 1.8) }, t0);

        document.querySelectorAll("#skyL .m-cloud").forEach(function (c, i) { tl.to(c, { x: 60 + (i % 3) * 40, duration: span, ease: "none" }, t0); });
        // fenetres qui scintillent (finis)
        document.querySelectorAll("#nearL svg rect[fill='#FFC24A']").forEach(function (r, i) { if (i % 6 === 0) tl.to(r, { opacity: 0.35, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, t0 + 0.4 + (i % 7) * 0.5); });
        // poussiere doree
        $("#motes").innerHTML = Q.moteField({ n: 46, w: 2400, h: 1200, seed: 9, rmin: 2, rmax: 6, stars: true });
        document.querySelectorAll("#motes .k-mote").forEach(function (m, i) {
          var x = +m.dataset.x, y = +m.dataset.y;
          tl.fromTo(m, { x: x, y: y, opacity: 0 }, { x: x + 40 - (i % 5) * 20, y: y - 160 - (i % 7) * 30, opacity: 0.9, duration: span * 0.5, ease: "sine.out" }, t0 + (i % 9) * 0.1);
          tl.to(m, { opacity: 0, duration: span * 0.5, ease: "sine.in" }, t0 + span * 0.5 + (i % 9) * 0.1);
        });
        // oiseaux
        for (var bI = 0; bI < 6; bI++) {
          var bd = document.createElement("div"); bd.className = "bird"; bd.setAttribute("data-layout-allow-overflow", "");
          bd.innerHTML = '<svg width="70" height="34" viewBox="-35 -17 70 34"><path class="wing" d="M-30 -2Q-16 -18 0 2Q16 -18 30 -2" stroke="#3b2373" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          $("#p2").insertBefore(bd, $("#qz"));
