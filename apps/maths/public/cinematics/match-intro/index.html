<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Match - versus</title>
    <script src="./_shared/hyperframe.runtime.iife.js"></script>
    <script src="./_shared/gsap.min.js"></script>
    <script src="./_shared/ceart.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("./_shared/Anton-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fredoka"; src: url("./_shared/Fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
      html, body { margin: 0; background: #070c2b; }
      #root, #root * { pointer-events: none; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070c2b; }
      #cam { position: absolute; inset: 0; transform-origin: 960px 600px; will-change: transform; }
      #bg { position: absolute; inset: 0; }
      /* stade flou et assombri = image pre-floutee + voile (pas de filtre anime : fluide sur tablette) */
      #bgsoft, #bgdim { position: absolute; inset: 0; width: 100%; height: 100%; will-change: opacity; }
      #bgsoft { object-fit: cover; }
      #bgdim { background: #000; opacity: 0.5; }
      .panel { position: absolute; inset: 0; }
      #panL { clip-path: polygon(0 0, 1087px 0, 833px 1200px, 0 1200px); }
      #panR { clip-path: polygon(1087px 0, 1920px 0, 1920px 1200px, 833px 1200px); }
      #speed { position: absolute; inset: 0; opacity: 0.35; }
      #seam { position: absolute; inset: 0; opacity: 0; }
      .crest { position: absolute; top: 110px; width: 540px; opacity: 0; }
      .crest::before { content: ""; position: absolute; inset: -140px; background: radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 62%); }
      .crest svg { position: relative; }
      .crest svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.45)); }
      #crestL { left: 250px; }
      #crestR { left: 1130px; }
      .plate { position: absolute; top: 830px; width: 560px; height: 140px; line-height: 140px; text-align: center; background: #0a1030; color: #fff; font-family: "Anton", sans-serif;
        font-size: 96px; letter-spacing: 3px; clip-path: polygon(7% 0, 100% 0, 93% 100%, 0 100%); opacity: 0; white-space: nowrap; }
      #plateL { left: 230px; }
      #plateR { left: 1110px; }
      #vs { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: "Anton", sans-serif; font-size: 350px; line-height: 1; color: #ffd23f; opacity: 0;
        -webkit-text-stroke: 14px #0a1030; paint-order: stroke fill; text-shadow: 0 16px 0 #0a1030, 0 40px 70px rgba(0, 0, 0, 0.55); }
      #ring { position: absolute; left: 960px; top: 540px; width: 340px; height: 340px; margin: -170px 0 0 -170px; border-radius: 50%; border: 18px solid #ffd23f; box-sizing: border-box; opacity: 0; }
      #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #fff6d6 0%, rgba(255, 246, 214, 0.45) 40%, rgba(255, 246, 214, 0) 72%); opacity: 0; }
      #band { position: absolute; left: 96px; top: 950px; width: 1728px; height: 170px; opacity: 0; filter: drop-shadow(0 14px 0 rgba(10, 16, 48, 0.55)); transform-origin: 0 50%; }
      #bandbg { position: absolute; inset: 0; background: #ffd23f; clip-path: polygon(70px 0, 100% 0, calc(100% - 70px) 100%, 0 100%); }
      #bandtxt { position: absolute; inset: 0; text-align: center; line-height: 170px; font-family: "Anton", sans-serif; font-size: 132px; letter-spacing: 6px; color: #0a1030; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="match-intro" data-start="0" data-width="1920" data-height="1200" data-duration="4">
      <div id="cam">
        <div id="bg" data-layout-ignore></div>
        <img id="bgsoft" src="./_shared/img/stadium-soft.webp" alt="" data-layout-ignore />
        <div id="bgdim" data-layout-ignore></div>
        <div id="panL" class="panel" data-layout-ignore></div>
        <div id="panR" class="panel" data-layout-ignore></div>
        <div id="speed" data-layout-ignore></div>
        <svg id="seam" viewBox="0 0 1920 1200" width="1920" height="1200" data-layout-ignore>
          <line x1="1087" y1="-20" x2="833" y2="1220" stroke="#fff" stroke-width="40" opacity="0.25" />
          <line x1="1087" y1="-20" x2="833" y2="1220" stroke="#fff" stroke-width="12" />
        </svg>
        <div id="flash"></div>
        <div id="crestL" class="crest" data-layout-allow-overflow></div>
        <div id="crestR" class="crest" data-layout-allow-overflow></div>
        <div id="plateL" class="plate" data-layout-allow-overflow>LIONS</div>
        <div id="plateR" class="plate" data-layout-allow-overflow>AIGLES</div>
      </div>
      <div id="ring"></div>
      <div id="vs" data-layout-allow-overflow>VS</div>
      <div id="band" data-layout-allow-overflow><div id="bandbg"></div><div id="bandtxt">COUP D'ENVOI</div></div>

      <audio id="a-sw" src="./_shared/sfx/swoosh-in.mp3" data-start="0" data-duration="0.2" data-track-index="1" data-volume="0.8"></audio>
      <audio id="a-h5" src="./_shared/sfx/hit05.mp3" data-start="0.42" data-duration="0.61" data-track-index="2" data-volume="0.8"></audio>
      <audio id="a-sw2" src="./_shared/sfx/swoosh-in.mp3" data-start="0.34" data-duration="0.2" data-track-index="3" data-volume="0.6"></audio>
      <audio id="a-h8" src="./_shared/sfx/hit08.mp3" data-start="1.0" data-duration="0.26" data-track-index="4" data-volume="0.9"></audio>
      <audio id="a-bh" src="./_shared/sfx/ball-hit.mp3" data-start="1.0" data-duration="1.2" data-track-index="5" data-volume="0.7"></audio>
      <audio id="a-sw3" src="./_shared/sfx/swoosh-in.mp3" data-start="2.9" data-duration="0.2" data-track-index="6" data-volume="0.7"></audio>
      <audio id="a-wh" src="./_shared/sfx/whistle-short.mp3" data-start="3.05" data-duration="0.95" data-track-index="7" data-volume="0.9"></audio>
      <audio id="a-ro" src="./_shared/sfx/roar-short.mp3" data-start="3.05" data-duration="0.95" data-track-index="8" data-volume="0.6"></audio>
    </div>
    <script>
      // Donnees (canal "match-intro") : { home:{name,primary,secondary,initials}, away:{...} }
      var DEFAULTS = {
        home: { name: "Lions", primary: "#E8212F", secondary: "#FFFFFF", initials: "LB" },
        away: { name: "Aigles", primary: "#1B6BFF", secondary: "#FFD23F", initials: "AZ" },
      };
      var cur = DEFAULTS, ready = false;
      function merge(d) { d = d || {}; return { home: Object.assign({}, DEFAULTS.home, d.home), away: Object.assign({}, DEFAULTS.away, d.away) }; }
      var tl = gsap.timeline({ paused: true });
      window.__hyperframes.registerRuntimeDataHandler("match-intro", function (d) { cur = merge(d); if (ready) build(); });
      // "Animations douces" (reglage parent / prefers-reduced-motion), envoye par l'app sur le canal "motion"
      window.__hyperframes.registerRuntimeDataHandler("motion", function (d) { CEArt.setSoft(!!(d && d.soft)); if (ready) build(); });
      var $ = function (s) { return document.querySelector(s); };

      $("#bg").innerHTML = CEArt.stadium({ raster: "./_shared/img/", flashes: 0, lights: "img" });
      $("#speed").innerHTML = CEArt.speedLines({ seed: 4, count: 30 });

      function panelCss(c) {
        return "radial-gradient(ellipse at 45% 45%, " + CEArt.shade(c, 0.18) + " 0%, " + c + " 45%, " + CEArt.shade(c, -0.62) + " 100%)," +
          "repeating-linear-gradient(-12deg, rgba(255,255,255,0.07) 0 70px, rgba(255,255,255,0) 70px 140px)";
      }
      function render() {
        var h = cur.home, a = cur.away;
        $("#panL").style.background = panelCss(h.primary);
        $("#panR").style.background = panelCss(a.primary);
        $("#crestL").innerHTML = CEArt.crest({ primary: h.primary, secondary: h.secondary, initials: h.initials });
        $("#crestR").innerHTML = CEArt.crest({ primary: a.primary, secondary: a.secondary, initials: a.initials });
        $("#plateL").textContent = h.name.toUpperCase();
        $("#plateR").textContent = a.name.toUpperCase();
      }

      function build() {
        tl.clear();
        gsap.set(["#cam", "#panL", "#panR", "#crestL", "#crestR", "#plateL", "#plateR", "#vs", "#ring", "#flash", "#band", "#seam", "#speed", "#bg", "#bgsoft", "#bgdim"], { clearProps: "all" });
        render();

        // --- 0.00 : stade assombri, puis panneaux de couleur
        tl.fromTo("#panL", { x: -1100 }, { x: 0, duration: 0.55, ease: "power3.out" }, 0);
        tl.fromTo("#panR", { x: 1100 }, { x: 0, duration: 0.55, ease: "power3.out" }, 0);
        tl.fromTo("#seam", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "sine.out" }, 0.3);
        tl.fromTo("#speed", { x: 420, opacity: 0.35 }, { x: -420, opacity: 0.35, duration: 0.9, ease: "none" }, 0);

        // --- 0.30 - 1.00 : whip-pan des blasons
        // whip-pan sans flou anime (le filtre blur recalcule a chaque image saccadait sur tablette)
        tl.fromTo("#crestL", { x: -1300, scale: 0.9, opacity: 1 }, { x: 0, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.3);
        tl.fromTo("#crestR", { x: 1300, scale: 0.9, opacity: 1 }, { x: 0, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.4);
        tl.fromTo("#plateL", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.8);
        tl.fromTo("#plateR", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.88);

        // --- 1.00 - 1.45 : VS
        tl.set("#vs", { scale: 3, rotation: -10, opacity: 0 }, 0);
        tl.to("#vs", { scale: 1, rotation: -4, duration: 0.35, ease: "expo.out" }, 1.0);
        tl.to("#vs", { opacity: 1, duration: 0.2, ease: "sine.out" }, 1.0);
        // bloom chaud et doux (<= 0,22, montee 0,3 s) a la place du flash blanc plein ecran
        CEArt.bloom(gsap, tl, "#flash", 0.87, 0.22, 0.3);
        CEArt.shake(gsap, tl, "#cam", 1.02, 16, 0.35);
        tl.set("#ring", { scale: 0.3, opacity: 1 }, 1.02);
        tl.to("#ring", { scale: 3.6, opacity: 0, duration: 0.55, ease: "expo.out" }, 1.02);

        // --- 1.45 - 2.90 : push-in lent, flottement, reflets
        tl.fromTo("#cam", { scale: 1 }, { scale: 1.06, duration: 1.45, ease: "sine.inOut" }, 1.45);
        tl.to("#crestL", { y: -12, duration: 0.7, ease: "sine.inOut" }, 1.45);
        tl.to("#crestL", { y: 0, duration: 0.7, ease: "sine.inOut" }, 2.15);
        tl.to("#crestR", { y: 12, duration: 0.7, ease: "sine.inOut" }, 1.45);
        tl.to("#crestR", { y: 0, duration: 0.7, ease: "sine.inOut" }, 2.15);
        ["#crestL", "#crestR"].forEach(function (id, i) {
          var sw = document.querySelector(id + " .crest-sweep");
          if (!sw) return;
          var t = 1.7 + i * 0.25;
          tl.set(sw, { x: 0, opacity: 0 }, 0);
          tl.to(sw, { x: 330, duration: 0.5, ease: "power2.inOut" }, t);
          tl.to(sw, { opacity: 1, duration: 0.2, ease: "sine.out" }, t);
          tl.to(sw, { opacity: 0, duration: 0.2, ease: "sine.in" }, t + 0.32);
        });

        // --- 2.90 - 3.35 : bandeau
        tl.fromTo("#band", { x: 1900, opacity: 1 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 2.9);
        tl.fromTo("#bandtxt", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.35, ease: "power2.out" }, 3.0);

        // --- 3.55 - 4.00 : ouverture sur le stade
        tl.to("#panL", { x: -1300, duration: 0.4, ease: "power3.in" }, 3.55);
        tl.to("#panR", { x: 1300, duration: 0.4, ease: "power3.in" }, 3.55);
        tl.to("#seam", { opacity: 0, duration: 0.15 }, 3.55);
        tl.to(["#crestL", "#crestR", "#plateL", "#plateR", "#vs"], { scale: 0.6, opacity: 0, duration: 0.3, ease: "power2.in" }, 3.55);
        tl.to("#band", { x: -1900, duration: 0.35, ease: "power3.in" }, 3.55);
        tl.to(["#bgsoft", "#bgdim"], { opacity: 0, duration: 0.45, ease: "sine.inOut" }, 3.55);
        tl.time(0);
      }
      build();
      ready = true;
      window.__timelines["match-intro"] = tl;
    </script>
  </body>
</html>
