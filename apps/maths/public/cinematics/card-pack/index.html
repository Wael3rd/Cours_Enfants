<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Paquet de cartes</title>
    <script src="./_shared/hyperframe.runtime.iife.js"></script>
    <script src="./_shared/gsap.min.js"></script>
    <script src="./_shared/ceart.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("./_shared/Anton-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fredoka"; src: url("./_shared/Fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
      html, body { margin: 0; background: #0a1030; }
      #root, #root * { pointer-events: none; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0a1030; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, #2a46c8 0%, #14206e 38%, #070c2b 80%); }
      #cam { position: absolute; inset: 0; transform-origin: 960px 600px; }
      #glow { position: absolute; left: 960px; top: 600px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; opacity: 0;
        background: radial-gradient(circle, rgba(255, 220, 110, 0.85), rgba(255, 220, 110, 0) 62%); }
      #rays { position: absolute; left: 960px; top: 600px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0; }
      #rays svg { width: 100%; height: 100%; }
      #pack { position: absolute; left: 720px; top: 229px; width: 480px; }
      #pack svg { width: 100%; height: auto; display: block; }
      #cardWrap { perspective: 1600px; position: absolute; left: 700px; top: 236px; width: 520px; height: 728px; }
      .face { position: absolute; inset: 0; opacity: 0; backface-visibility: hidden; }
      .face svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.5)); }
      #chroma { position: absolute; left: 960px; top: 600px; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%; opacity: 0;
        background: conic-gradient(from 0deg, #00f0ff, #7b5cff, #ff4fd8, #ffe14f, #3cff9e, #00f0ff); filter: blur(60px); }
      #ring { position: absolute; left: 960px; top: 600px; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; border: 22px solid #ffd23f; box-sizing: border-box; opacity: 0; }
      .spk { position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; opacity: 0; }
      .spk svg { width: 100%; height: 100%; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
      #confetti { position: absolute; inset: 0; }
      #fade { position: absolute; inset: 0; background: #0a1030; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="card-pack" data-start="0" data-width="1920" data-height="1200" data-duration="3">
      <div id="bg"></div>
      <div id="cam">
        <div id="chroma"></div>
        <div id="glow"></div>
        <div id="rays" data-layout-ignore></div>
        <div id="pack" data-layout-ignore></div>
        <div id="cardWrap" data-layout-ignore>
          <div id="cardBack" class="face"></div>
          <div id="cardFront" class="face"></div>
        </div>
        <div id="sparks" data-layout-ignore></div>
      </div>
      <div id="ring"></div>
      <div id="flash"></div>
      <div id="confetti" data-layout-ignore></div>
      <div id="fade"></div>

      <audio id="a-sw" src="./_shared/sfx/swoosh-in.mp3" data-start="0" data-duration="0.2" data-track-index="1" data-volume="0.8"></audio>
      <audio id="a-p1" src="./_shared/sfx/pop.mp3" data-start="0.32" data-duration="0.1" data-track-index="2" data-volume="0.9"></audio>
      <audio id="a-t1" src="./_shared/sfx/tick.mp3" data-start="0.55" data-duration="0.05" data-track-index="3" data-volume="0.8"></audio>
      <audio id="a-t2" src="./_shared/sfx/tick.mp3" data-start="0.7" data-duration="0.05" data-track-index="4" data-volume="0.9"></audio>
      <audio id="a-t3" src="./_shared/sfx/tick.mp3" data-start="0.85" data-duration="0.05" data-track-index="5" data-volume="1"></audio>
      <audio id="a-p2" src="./_shared/sfx/pop.mp3" data-start="0.95" data-duration="0.1" data-track-index="6" data-volume="1"></audio>
      <audio id="a-h5" src="./_shared/sfx/hit05.mp3" data-start="0.95" data-duration="0.61" data-track-index="7" data-volume="0.8"></audio>
      <audio id="a-sw2" src="./_shared/sfx/swoosh-out.mp3" data-start="1.5" data-duration="0.21" data-track-index="8" data-volume="0.7"></audio>
      <audio id="a-lu" src="./_shared/sfx/level-up-big.mp3" data-start="1.6" data-duration="1.01" data-track-index="9" data-volume="0.7"></audio>
      <audio id="a-st" src="./_shared/sfx/star.mp3" data-start="1.62" data-duration="0.12" data-track-index="10" data-volume="0.9"></audio>
      <audio id="a-ro" src="./_shared/sfx/roar-short.mp3" data-start="1.65" data-duration="1.35" data-track-index="11" data-volume="0.5"></audio>
    </div>
    <script>
      // Donnees (canal "card-pack") : { card:{ name, number, position, rarity, primary, secondary } }
      var DEFAULTS = { card: { name: "Léo Martin", number: 10, position: "ATT", rarity: "or", primary: "#E8212F", secondary: "#FFFFFF" } };
      var RARITY = { bronze: { conf: 20, spk: 0 }, argent: { conf: 40, spk: 3 }, or: { conf: 70, spk: 5 }, legende: { conf: 120, spk: 8 } };
      var cur = DEFAULTS, ready = false;
      var tl = gsap.timeline({ paused: true });
      window.__hyperframes.registerRuntimeDataHandler("card-pack", function (d) { cur = { card: Object.assign({}, DEFAULTS.card, (d || {}).card) }; if (ready) build(); });
      var $ = function (s) { return document.querySelector(s); };
      $("#rays").innerHTML = CEArt.rays({ count: 18, color: "#ffd23f", opacity: 1, size: 2400 });
      var SP = [[640, 330], [1280, 340], [600, 640], [1330, 660], [800, 220], [1130, 230], [700, 900], [1240, 910]];
      $("#sparks").innerHTML = SP.map(function (p, i) { return '<div class="spk" id="spk' + i + '" style="left:' + p[0] + "px;top:" + p[1] + 'px">' + CEArt.sparkle({ size: 150, color: i % 2 ? "#fff3b0" : "#ffffff" }) + "</div>"; }).join("");

      function render() {
        var c = cur.card;
        $("#pack").innerHTML = CEArt.cardPack({});
        $("#cardBack").innerHTML = CEArt.cardBack({});
        $("#cardFront").innerHTML = CEArt.cardFrame({ name: c.name, number: c.number, position: c.position, rarity: c.rarity, primary: c.primary, secondary: c.secondary, player: CEArt.avatarOf(c.name) });
        $("#ring").style.borderColor = c.rarity === "argent" ? "#dfe8ff" : c.rarity === "bronze" ? "#e0975c" : c.rarity === "legende" ? "#ff4fd8" : "#ffd23f";
      }

      function build() {
        tl.clear();
        gsap.set(["#cam", "#glow", "#rays", "#pack", ".face", "#chroma", "#ring", ".spk", "#flash", "#fade", "#cardWrap"], { clearProps: "transform,opacity" });
        render();
        var c = cur.card, R = RARITY[c.rarity] || RARITY.bronze;
        var pk = $("#pack svg"), top = $("#pack .pk-top"), body = $("#pack .pk-body");

        // chute du paquet
        tl.set("#pack", { y: -1100, opacity: 1, scaleY: 1, transformOrigin: "50% 100%" }, 0);
        tl.to("#pack", { y: 0, duration: 0.3, ease: "power2.in" }, 0);
        tl.to("#pack", { y: -30, duration: 0.1, ease: "power2.out" }, 0.3);
        tl.to("#pack", { y: 0, duration: 0.1, ease: "power2.in" }, 0.4);
        tl.to("#pack", { scaleY: 0.93, duration: 0.05, ease: "power2.out" }, 0.3);
        tl.to("#pack", { scaleY: 1, duration: 0.2, ease: "back.out(3)" }, 0.35);
        CEArt.shake(gsap, tl, "#cam", 0.31, 8, 0.2);

        // tremblement
        var t = 0.5, amps = [5, -6, 6, -7, 7, -8];
        amps.forEach(function (a, i) { tl.to("#pack", { rotation: a, x: a * 1.4, duration: 0.07, ease: "sine.inOut" }, t + i * 0.075); });
        tl.to("#pack", { rotation: 0, x: 0, duration: 0.05 }, 0.95);
        tl.fromTo("#glow", { opacity: 0 }, { opacity: 0.8, duration: 0.45, ease: "power2.in" }, 0.5);

        // dechirure
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.05, ease: "power1.out" }, 0.95);
        tl.to("#flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, 1.0);
        tl.to(top, { x: 260, y: -380, rotation: 28, opacity: 0, svgOrigin: "220 60", duration: 0.3, ease: "power2.out" }, 0.95);
        tl.to(body, { y: 420, scale: 0.85, opacity: 0, svgOrigin: "220 340", duration: 0.3, ease: "power2.in" }, 0.97);
        tl.fromTo("#rays", { opacity: 0, rotation: 0 }, { opacity: 0.55, duration: 0.25, ease: "power2.out" }, 0.95);
        tl.to("#rays", { rotation: 30, duration: 2.05, ease: "none" }, 0.95);
        tl.set("#ring", { scale: 0.3, opacity: 1 }, 0.95);
        tl.to("#ring", { scale: 3.4, opacity: 0, duration: 0.6, ease: "expo.out" }, 0.95);
        tl.to("#pack", { opacity: 0, duration: 0.05 }, 1.25);

        // la carte monte (dos)
        tl.set("#cardBack", { y: 260, scale: 0.7, rotationY: 0 }, 0);
        tl.fromTo("#cardBack", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.05);
        tl.to("#cardBack", { y: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 1.05);
        tl.to("#cardBack", { rotationY: 90, duration: 0.25, ease: "power2.in" }, 1.55);
        tl.set("#cardFront", { rotationY: -90 }, 0);
        tl.fromTo("#cardFront", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 1.8);
        tl.to("#cardFront", { rotationY: 0, duration: 0.25, ease: "power2.out" }, 1.8);
        tl.to("#cardWrap", { scale: 1.18, duration: 0.25, ease: "power2.out" }, 1.55);
        tl.to("#cardWrap", { scale: 1.12, duration: 0.3, ease: "back.out(2)" }, 1.8);
        tl.to("#cardBack", { opacity: 0, duration: 0.01 }, 1.8);

        // explosion de rarete
        $("#confetti").innerHTML = "";
        CEArt.confetti(gsap, tl, $("#confetti"), { at: 1.8, count: R.conf, x: 960, y: 640, power: 1150, spread: 80, gravity: 1700, duration: 1.4, seed: 51, colors: c.rarity === "legende" ? ["#00F0FF", "#FF4FD8", "#FFE14F", "#FFFFFF", "#7B5CFF", "#3CFF9E"] : c.rarity === "argent" ? ["#FFFFFF", "#D3DAE6", "#8A95A8", "#35D6FF"] : c.rarity === "bronze" ? ["#E0975C", "#FFD9B3", "#9A5A2B"] : ["#FFD23F", "#FFFFFF", "#FF4D6D", "#35D6FF", "#FFF3B0"] });
        SP.forEach(function (p, i) {
          if (i >= R.spk) return;
          tl.fromTo("#spk" + i, { scale: 0, opacity: 1, rotation: 0 }, { scale: 1 + (i % 3) * 0.3, rotation: 40, opacity: 1, duration: 0.28, ease: "back.out(3)" }, 1.82 + i * 0.05);
          tl.to("#spk" + i, { scale: 0, opacity: 0, duration: 0.4, ease: "power2.in" }, 2.2 + i * 0.05);
        });
        tl.set("#ring", { scale: 0.3, opacity: 1 }, 1.8);
        tl.to("#ring", { scale: 3.2, opacity: 0, duration: 0.6, ease: "expo.out" }, 1.8);
        if (c.rarity === "legende") {
          tl.fromTo("#chroma", { opacity: 0, rotation: 0 }, { opacity: 0.75, duration: 0.3, ease: "power2.out" }, 1.8);
          tl.to("#chroma", { rotation: 120, duration: 1.2, ease: "none" }, 1.8);
          tl.to("#chroma", { opacity: 0.25, duration: 0.8, ease: "power1.in" }, 2.2);
        }

        // reflet holographique
        var shine = $("#cardFront .card-shine");
        tl.set(shine, { x: 0, opacity: 0 }, 0);
        tl.to(shine, { x: 1100, duration: 0.55, ease: "power2.inOut" }, 2.0);
        tl.to(shine, { opacity: 1, duration: 0.08 }, 2.0);
        tl.to(shine, { opacity: 0, duration: 0.1 }, 2.47);
        if (c.rarity === "legende") {
          tl.to(shine, { x: 0, duration: 0.01 }, 2.5);
          tl.to(shine, { opacity: 1, duration: 0.05 }, 2.52);
          tl.to(shine, { x: 1100, duration: 0.45, ease: "power2.inOut" }, 2.52);
        }

        // maintien + sortie
        tl.to("#cardWrap", { y: -8, rotation: 1.2, duration: 0.6, ease: "sine.inOut" }, 2.2);
        tl.to("#cardWrap", { y: 0, rotation: -1, duration: 0.6, ease: "sine.inOut" }, 2.81);
        tl.to("#cam", { scale: 1.05, duration: 1.4, ease: "sine.inOut" }, 1.6);
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.in" }, 2.75);
        tl.time(0);
      }
      build();
      ready = true;
      window.__timelines["card-pack"] = tl;
    </script>
  </body>
</html>
