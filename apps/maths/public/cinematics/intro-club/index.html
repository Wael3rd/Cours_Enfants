<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Intro du club</title>
    <script src="./_shared/hyperframe.runtime.iife.js"></script>
    <script src="./_shared/gsap.min.js"></script>
    <script src="./_shared/ceart.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("./_shared/Anton-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fredoka"; src: url("./_shared/Fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
      html, body { margin: 0; background: #070c2b; }
      #root, #root * { pointer-events: none; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070c2b; }
      /* perf tablette : calques composes par le GPU (transform/opacite animes sans repeindre le contenu) */
      #cam { position: absolute; inset: 0; transform-origin: 960px 700px; will-change: transform; }
      #stadium { position: absolute; inset: 0; }
      #dim { position: absolute; inset: 0; background: #070c2b; opacity: 0; will-change: opacity; }
      .spk { position: absolute; left: 0; top: 0; width: 150px; height: 150px; margin: -75px 0 0 -75px; opacity: 0; }
      .spk svg { width: 100%; height: 100%; }
      #veil { position: absolute; inset: 0; background: rgba(7, 12, 43, 0.82); opacity: 0; }
      #rays { position: absolute; left: 960px; top: 520px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0; will-change: transform, opacity; }
      #rays svg { width: 100%; height: 100%; }
      #crestMain { position: absolute; left: 650px; top: 132px; width: 620px; opacity: 0; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, 0.5)); will-change: transform; }
      #crestMain svg { display: block; width: 100%; height: auto; }
      #ring { position: absolute; left: 960px; top: 520px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 50%; border: 20px solid #ffd23f; box-sizing: border-box; opacity: 0; }
      #sparks .spk { width: 110px; height: 110px; margin: -55px 0 0 -55px; }
      #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #fff6d6 0%, rgba(255, 246, 214, 0.45) 40%, rgba(255, 246, 214, 0) 72%); opacity: 0; }
      #line1 { position: absolute; left: 96px; top: 190px; height: 130px; padding: 0 56px 0 46px; line-height: 130px; background: #0a1030; color: #fff; font-family: "Fredoka", sans-serif; font-weight: 700;
        font-size: 84px; clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 100%, 0 100%); opacity: 0; white-space: nowrap; }
      #name { position: absolute; left: 96px; top: 290px; font-family: "Anton", sans-serif; color: #ffd23f; line-height: 1.12; white-space: nowrap; opacity: 0;
        -webkit-text-stroke: 12px #0a1030; paint-order: stroke fill; text-shadow: 0 12px 0 #0a1030, 0 34px 50px rgba(0, 0, 0, 0.55); }
      #name span { display: inline-block; }
      #player { position: absolute; left: 1300px; top: 480px; width: 440px; opacity: 0; }
      #player svg { width: 100%; height: auto; display: block; }
      #confetti { position: absolute; inset: 0; }
      #ltwrap { position: absolute; left: 96px; top: 880px; width: 1000px; opacity: 0; }
      #ltwrap svg { width: 100%; height: auto; display: block; }
      #fade { position: absolute; inset: 0; background: #070c2b; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro-club" data-start="0" data-width="1920" data-height="1200" data-duration="7">
      <div id="cam">
        <div id="stadium" data-layout-ignore></div>
        <div id="dim" data-layout-ignore></div>
        <div id="sparks" data-layout-ignore></div>
      </div>
      <div id="veil"></div>
      <div id="rays" data-layout-ignore></div>
      <div id="crestMain" data-layout-allow-overflow></div>
      <div id="ring"></div>
      <div id="flash"></div>
      <div id="line1" data-layout-allow-overflow>Bienvenue au club,</div>
      <div id="name" data-layout-allow-overflow>Léo</div>
      <div id="player" data-layout-allow-overflow data-layout-ignore></div>
      <div id="confetti" data-layout-ignore></div>
      <div id="ltwrap" data-layout-allow-overflow></div>
      <div id="fade"></div>

      <audio id="a-mur" src="./_shared/sfx/murmur.mp3" data-start="0" data-duration="5.2" data-track-index="1" data-volume="0.8"></audio>
      <audio id="a-h1" src="./_shared/sfx/hit00.mp3" data-start="0.35" data-duration="0.27" data-track-index="2" data-volume="0.35"></audio>
      <audio id="a-h2" src="./_shared/sfx/hit00.mp3" data-start="0.75" data-duration="0.27" data-track-index="3" data-volume="0.5"></audio>
      <audio id="a-h3" src="./_shared/sfx/hit00.mp3" data-start="1.15" data-duration="0.27" data-track-index="4" data-volume="0.65"></audio>
      <audio id="a-h4" src="./_shared/sfx/hit00.mp3" data-start="1.55" data-duration="0.27" data-track-index="5" data-volume="0.8"></audio>
      <audio id="a-st" src="./_shared/sfx/steel03.mp3" data-start="2.6" data-duration="1.39" data-track-index="6" data-volume="0.8"></audio>
      <audio id="a-bh" src="./_shared/sfx/ball-hit.mp3" data-start="2.6" data-duration="1.2" data-track-index="7" data-volume="0.7"></audio>
      <audio id="a-rs" src="./_shared/sfx/roar-short.mp3" data-start="4.4" data-duration="2.6" data-track-index="8" data-volume="0.7"></audio>
      <audio id="a-sw" src="./_shared/sfx/swoosh-in.mp3" data-start="4.5" data-duration="0.2" data-track-index="9" data-volume="0.7"></audio>
      <audio id="a-p1" src="./_shared/sfx/pop.mp3" data-start="4.85" data-duration="0.1" data-track-index="10" data-volume="0.8"></audio>
      <audio id="a-p2" src="./_shared/sfx/pop.mp3" data-start="5.1" data-duration="0.1" data-track-index="11" data-volume="0.8"></audio>
      <audio id="a-p3" src="./_shared/sfx/pop.mp3" data-start="5.3" data-duration="0.1" data-track-index="12" data-volume="0.8"></audio>
      <audio id="a-co" src="./_shared/sfx/combo.mp3" data-start="5.45" data-duration="0.35" data-track-index="13" data-volume="0.8"></audio>
      <audio id="a-ro" src="./_shared/sfx/roar-outro.mp3" data-start="4.6" data-duration="2.4" data-track-index="14" data-volume="0.6"></audio>
    </div>
    <script>
      // Donnees (canal "intro-club") : { name, club:{name, primary, secondary, initials} }
      var DEFAULTS = { name: "Léo", club: { name: "Les Lions", primary: "#E8212F", secondary: "#FFFFFF", initials: "LB" } };
      var cur = DEFAULTS, ready = false;
      function merge(d) { d = d || {}; return { name: d.name || DEFAULTS.name, club: Object.assign({}, DEFAULTS.club, d.club) }; }
      var tl = gsap.timeline({ paused: true });
      window.__hyperframes.registerRuntimeDataHandler("intro-club", function (d) { cur = merge(d); if (ready) build(); });
      // "Animations douces" (reglage parent / prefers-reduced-motion), envoye par l'app sur le canal "motion"
      window.__hyperframes.registerRuntimeDataHandler("motion", function (d) { CEArt.setSoft(!!(d && d.soft)); if (ready) build(); });
      var $ = function (s) { return document.querySelector(s); };

      var BANKS = [250, 700, 1220, 1670];
      // stade rasterise (tribunes en WebP) + projecteurs SVG animables + 8 emplacements de flashs (politique "mouvement sur")
      $("#stadium").innerHTML = CEArt.stadium({ raster: "./_shared/img/", flashes: 8 });
      $("#rays").innerHTML = CEArt.rays({ count: 18, color: "#ffd23f", opacity: 1, size: 2400 });
      $("#sparks").innerHTML = BANKS.map(function (x, i) { return '<div class="spk" id="spk' + i + '" style="left:' + x + 'px;top:192px">' + CEArt.sparkle({ size: 150 }) + "</div>"; }).join("") +
        [[560, 300], [1360, 340], [700, 700], [1280, 720], [500, 520], [1420, 560]].map(function (p, i) { return '<div class="spk" id="spc' + i + '" style="left:' + p[0] + 'px;top:' + p[1] + 'px">' + CEArt.sparkle({ size: 110, color: "#ffe680" }) + "</div>"; }).join("");

      function render() {
        var c = cur.club;
        $("#crestMain").innerHTML = CEArt.crest({ primary: c.primary, secondary: c.secondary, initials: c.initials });
        $("#ring").style.borderColor = c.secondary && CEArt.lum(c.primary) < 0.2 ? "#ffd23f" : CEArt.shade(c.primary, 0.25);
        var nm = cur.name, fs = Math.min(400, Math.floor(1500 / (nm.length * 0.47)));
        var el = $("#name"); el.style.fontSize = fs + "px"; el.innerHTML = "";
        nm.split("").forEach(function (ch) { var s = document.createElement("span"); s.textContent = ch === " " ? " " : ch; el.appendChild(s); });
        var ex = document.createElement("span"); ex.id = "excl"; ex.textContent = "!"; el.appendChild(ex);
        $("#ltwrap").innerHTML = CEArt.lowerThird({ title: c.name, subtitle: "Ton club, ta saison commence", primary: c.primary, accent: "#FFD23F" });
        $("#player").innerHTML = CEArt.player({ primary: c.primary, secondary: c.secondary, kit: "bande", hair: "boucles", skin: 3, hairColor: 5, number: 10, pose: "course" });
      }

      function build() {
        tl.clear();
        gsap.set(["#cam", "#stadium", "#dim", "#veil", "#rays", "#crestMain", "#ring", "#flash", "#line1", "#name", "#player", "#ltwrap", "#fade", ".spk"], { clearProps: "transform,opacity" });
        render();
        var stad = $("#stadium"), svg = $("#player svg");
        CEArt.setPose(gsap, svg, "course");

        // ---- Plan A : allumage du stade (crane up)
        tl.set("#cam", { y: 300, scale: 1.28 }, 0);
        tl.to("#cam", { y: 0, scale: 1.0, duration: 2.6, ease: "power2.out" }, 0);
        // le stade s'allume : voile sombre qui se leve (opacite seule, pas de filtre anime : fluide sur tablette)
        tl.set("#dim", { opacity: 0.82 }, 0);
        tl.to("#dim", { opacity: 0, duration: 1.9, ease: "sine.in" }, 0.4);
        BANKS.forEach(function (x, i) {
          var t = 0.35 + i * 0.4;
          var halo = $(".st-bank-" + i + " .st-halo"), bank = $(".st-bank-" + i), beam = $(".st-beam-" + i);
          tl.set(halo, { opacity: 0 }, 0);
          tl.set(beam, { opacity: 0 }, 0);
          tl.set(bank, { opacity: 0.3 }, 0);
          // allumage doux (fondus >= 0,3 s, pas de gresillement du halo)
          tl.to(bank, { opacity: 1, duration: 0.3, ease: "sine.out" }, t);
          tl.to(halo, { opacity: 1, duration: 0.4, ease: "sine.out" }, t);
          tl.to(beam, { opacity: 1, duration: 0.6, ease: "sine.out" }, t + 0.05);
          tl.fromTo("#spk" + i, { opacity: 1, scale: 0 }, { opacity: 1, scale: 0.9, duration: 0.35, ease: "sine.out" }, t);
          tl.to("#spk" + i, { scale: 0, opacity: 0, duration: 0.45, ease: "sine.in" }, t + 0.4);
        });
        CEArt.crowdFlashes(gsap, tl, stad, 1.6, 1.1, 1, 5);

        // ---- Plan B : le blason claque
        // bloom chaud et doux (<= 0,22) a la place du flash blanc plein ecran
        CEArt.bloom(gsap, tl, "#flash", 2.5, 0.22, 0.3);
        tl.fromTo("#veil", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.55);
        // rayons discrets et lents (< 1 passage par seconde en un point)
        tl.fromTo("#rays", { opacity: 0, rotation: 0 }, { opacity: 0.18, duration: 0.5, ease: "sine.out" }, 2.6);
        tl.to("#rays", { rotation: 16, duration: 2.0, ease: "none" }, 2.6);
        // le blason arrive en grand et se pose (mouvement vif) mais apparait en fondu (0,3 s) : pas d'eclair lumineux
        tl.set("#crestMain", { scale: 3.2, rotation: -8, opacity: 0 }, 0);
        tl.to("#crestMain", { scale: 1, rotation: 0, duration: 0.45, ease: "expo.out" }, 2.6);
        tl.to("#crestMain", { opacity: 1, duration: 0.3, ease: "sine.out" }, 2.6);
        tl.set("#ring", { scale: 0.3, opacity: 1 }, 2.6);
        tl.to("#ring", { scale: 3, opacity: 0, duration: 0.6, ease: "expo.out" }, 2.6);
        CEArt.shake(gsap, tl, "#cam", 2.62, 20, 0.4);
        tl.to("#cam", { scale: 1.08, duration: 2.0, ease: "sine.inOut" }, 2.6);
        tl.to("#crestMain", { scale: 1.04, duration: 0.7, ease: "sine.inOut" }, 3.07);
        tl.to("#crestMain", { scale: 1.0, duration: 0.7, ease: "sine.inOut" }, 3.8);
        var sw = $("#crestMain .crest-sweep");
        tl.set(sw, { x: 0, opacity: 0 }, 0);
        tl.to(sw, { x: 330, duration: 0.5, ease: "power2.inOut" }, 3.3);
        tl.to(sw, { opacity: 1, duration: 0.2, ease: "sine.out" }, 3.3);
        tl.to(sw, { opacity: 0, duration: 0.2, ease: "sine.in" }, 3.62);
        for (var k = 0; k < 6; k++) {
          tl.fromTo("#spc" + k, { opacity: 1, scale: 0 }, { opacity: 1, scale: 0.8 + (k % 3) * 0.2, duration: 0.4, ease: "sine.out" }, 3.0 + k * 0.14);
          tl.to("#spc" + k, { opacity: 0, scale: 0, duration: 0.45, ease: "sine.in" }, 3.55 + k * 0.1);
        }

        // ---- Plan C : bienvenue
        tl.to("#crestMain", { x: 650, y: -260, scale: 0.4, duration: 0.55, ease: "power3.inOut" }, 4.5);
        tl.to("#rays", { opacity: 0.07, duration: 0.6, ease: "sine.inOut" }, 4.5);
        tl.to("#veil", { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 4.5);
        tl.fromTo("#line1", { x: -300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 4.6);
        tl.fromTo("#name", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 4.8);
        var letters = document.querySelectorAll("#name span:not(#excl)");
        letters.forEach(function (l, i) {
          tl.fromTo(l, { y: 160, rotation: i % 2 ? 12 : -12, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, 4.8 + i * 0.07);
        });
        tl.fromTo("#excl", { scale: 2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, 5.45);
        tl.to("#name", { y: -8, duration: 0.7, ease: "sine.inOut" }, 5.8);
        tl.to("#name", { y: 0, duration: 0.5, ease: "sine.inOut" }, 6.5);

        // joueur : course puis saut de joie
        tl.fromTo("#player", { x: 700, opacity: 1 }, { x: 0, opacity: 1, duration: 1.1, ease: "power2.out" }, 4.35);
        CEArt.runCycle(gsap, tl, svg, 4.35, 1.1, 0.42);
        CEArt.toPose(gsap, tl, svg, "celebration", 5.5, 0.3, "back.out(1.6)");
        tl.to("#player", { y: -80, duration: 0.25, ease: "power2.out" }, 5.5);
        tl.to("#player", { y: 0, duration: 0.25, ease: "power2.in" }, 5.75);
        tl.to("#player", { y: -40, duration: 0.2, ease: "power2.out" }, 6.2);
        tl.to("#player", { y: 0, duration: 0.2, ease: "power2.in" }, 6.4);
        $("#confetti").innerHTML = "";
        CEArt.confetti(gsap, tl, $("#confetti"), { at: 5.5, count: 70, x: 1420, y: 700, power: 900, spread: 55, gravity: 1500, duration: 1.8, seed: 12, colors: [cur.club.primary, cur.club.secondary, "#FFD23F", "#FFFFFF", "#35D6FF"] });

        tl.to("#cam", { scale: 1.14, duration: 1.4, ease: "sine.inOut" }, 5.6);
        tl.fromTo("#ltwrap", { x: -1300, opacity: 1 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 5.7);
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.in" }, 6.7);
        tl.time(0);
      }
      build();
      ready = true;
      window.__timelines["intro-club"] = tl;
    </script>
  </body>
</html>
