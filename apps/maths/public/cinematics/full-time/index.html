<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>Fin de match</title>
    <script src="./_shared/hyperframe.runtime.iife.js"></script>
    <script src="./_shared/gsap.min.js"></script>
    <script src="./_shared/ceart.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("./_shared/Anton-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fredoka"; src: url("./_shared/Fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
      html, body { margin: 0; background: #070c2b; }
      #root, #root * { pointer-events: none; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070c2b; color: #fff; font-family: "Fredoka", sans-serif; }
      /* stade flou et assombri = image pre-floutee + voile (aucun filtre : fluide sur tablette) */
      #bg { position: absolute; inset: 0; background: #000; }
      #bg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.42; }
      #cam { position: absolute; inset: 0; transform-origin: 1100px 600px; will-change: transform; }
      #banner { position: absolute; left: 700px; top: 66px; width: 1000px; height: 96px; line-height: 96px; text-align: center; background: #ffd23f; color: #0a1030; font-weight: 700; font-size: 58px;
        clip-path: polygon(40px 0, 100% 0, calc(100% - 40px) 100%, 0 100%); opacity: 0; white-space: nowrap; }
      #panel { position: absolute; left: 560px; top: 196px; width: 1264px; height: 372px; opacity: 0; }
      #panelbg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, #1b2c86 0%, #0a1030 70%); clip-path: polygon(44px 0, 100% 0, calc(100% - 44px) 100%, 0 100%); }
      #panelbar { position: absolute; left: 0; top: 0; right: 0; height: 12px; }
      .crest { position: absolute; top: 36px; width: 210px; }
      .crest svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.45)); }
      #crestH { left: 90px; }
      #crestA { right: 90px; }
      .tname { position: absolute; top: 300px; width: 330px; text-align: center; font-weight: 700; font-size: 42px; white-space: nowrap; }
      #nameH { left: 30px; }
      #nameA { right: 30px; }
      .score { position: absolute; top: 26px; width: 260px; text-align: center; font-family: "Anton", sans-serif; font-size: 270px; line-height: 1.15; color: #fff; }
      #sH { left: 312px; }
      #sA { left: 692px; }
      #dash { position: absolute; left: 592px; top: 110px; width: 80px; text-align: center; font-family: "Anton", sans-serif; font-size: 150px; line-height: 1.2; color: #7f8ccf; }
      #verdict { position: absolute; left: 560px; top: 602px; width: 600px; height: 130px; opacity: 0; }
      #verdictbg { position: absolute; inset: 0; clip-path: polygon(34px 0, 100% 0, calc(100% - 34px) 100%, 0 100%); }
      #verdicttxt { position: absolute; inset: 0; text-align: center; line-height: 134px; font-family: "Anton", sans-serif; font-size: 104px; letter-spacing: 4px; color: #0a1030; white-space: nowrap; }
      #ring { position: absolute; left: 860px; top: 667px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 16px solid #ffd23f; box-sizing: border-box; opacity: 0; }
      #stars { position: absolute; left: 1200px; top: 590px; width: 624px; height: 160px; }
      .star { position: absolute; top: 0; width: 170px; height: 160px; opacity: 0; }
      .star svg { width: 100%; height: 100%; overflow: visible; }
      .tile { position: absolute; top: 790px; width: 400px; height: 260px; opacity: 0; }
      #t0 { left: 560px; }
      #t1 { left: 992px; }
      #t2 { left: 1424px; }
      .tilebg { position: absolute; inset: 0; background: #0a1030; clip-path: polygon(26px 0, 100% 0, calc(100% - 26px) 100%, 0 100%); }
      .tilebar { position: absolute; left: 0; top: 0; right: 0; height: 14px; }
      .tl { position: absolute; left: 0; right: 0; top: 36px; text-align: center; font-weight: 600; font-size: 40px; color: #c9d3ff; }
      .tv { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-family: "Anton", sans-serif; font-size: 138px; line-height: 1.25; color: #ffd23f; white-space: nowrap; }
      #player { position: absolute; left: 96px; top: 500px; width: 420px; opacity: 0; }
      #player svg { width: 100%; height: auto; display: block; }
      #confetti { position: absolute; inset: 0; }
      #fade { position: absolute; inset: 0; background: #070c2b; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="full-time" data-start="0" data-width="1920" data-height="1200" data-duration="6">
      <div id="bg" data-layout-ignore></div>
      <div id="cam">
        <div id="banner" data-layout-allow-overflow>Coup de sifflet final</div>
        <div id="panel" data-layout-allow-overflow data-layout-allow-occlusion>
          <div id="panelbg"></div>
          <div id="panelbar"></div>
          <div id="crestH" class="crest"></div>
          <div id="crestA" class="crest"></div>
          <div id="nameH" class="tname">Lions</div>
          <div id="nameA" class="tname">Aigles</div>
          <div id="sH" class="score">3</div>
          <div id="dash">-</div>
          <div id="sA" class="score">2</div>
        </div>
        <div id="ring"></div>
        <div id="verdict" data-layout-allow-overflow><div id="verdictbg"></div><div id="verdicttxt">VICTOIRE !</div></div>
        <div id="stars"></div>
        <div id="t0" class="tile" data-layout-allow-overflow><div class="tilebg"></div><div class="tilebar" style="background: #ff4d6d"></div><div class="tl">Buts</div><div class="tv">4</div></div>
        <div id="t1" class="tile" data-layout-allow-overflow><div class="tilebg"></div><div class="tilebar" style="background: #35d6ff"></div><div class="tl">Temps moyen</div><div class="tv">1,9 s</div></div>
        <div id="t2" class="tile" data-layout-allow-overflow><div class="tilebg"></div><div class="tilebar" style="background: #ffd23f"></div><div class="tl">Meilleure série</div><div class="tv">5</div></div>
        <div id="player" data-layout-allow-overflow data-layout-ignore></div>
        <div id="confetti" data-layout-ignore></div>
      </div>
      <div id="fade"></div>

      <audio id="a-wh" src="./_shared/sfx/whistle-triple.mp3" data-start="0" data-duration="3.9" data-track-index="1" data-volume="0.9"></audio>
      <audio id="a-sw" src="./_shared/sfx/swoosh-in.mp3" data-start="0.4" data-duration="0.2" data-track-index="2" data-volume="0.7"></audio>
      <audio id="a-t1" src="./_shared/sfx/tick.mp3" data-start="1.05" data-duration="0.05" data-track-index="3" data-volume="0.7"></audio>
      <audio id="a-t2" src="./_shared/sfx/tick.mp3" data-start="1.2" data-duration="0.05" data-track-index="4" data-volume="0.7"></audio>
      <audio id="a-t3" src="./_shared/sfx/tick.mp3" data-start="1.35" data-duration="0.05" data-track-index="5" data-volume="0.7"></audio>
      <audio id="a-t4" src="./_shared/sfx/tick.mp3" data-start="1.4" data-duration="0.05" data-track-index="6" data-volume="0.7"></audio>
      <audio id="a-t5" src="./_shared/sfx/tick.mp3" data-start="1.55" data-duration="0.05" data-track-index="7" data-volume="0.7"></audio>
      <audio id="a-t6" src="./_shared/sfx/tick.mp3" data-start="1.7" data-duration="0.05" data-track-index="8" data-volume="0.7"></audio>
      <audio id="a-co" src="./_shared/sfx/combo.mp3" data-start="1.9" data-duration="0.35" data-track-index="9" data-volume="0.8"></audio>
      <audio id="a-ro" src="./_shared/sfx/roar-short.mp3" data-start="1.95" data-duration="2.6" data-track-index="10" data-volume="0.6"></audio>
      <audio id="a-s1" src="./_shared/sfx/streak-3.mp3" data-start="2.3" data-duration="0.37" data-track-index="11" data-volume="0.7"></audio>
      <audio id="a-s2" src="./_shared/sfx/streak-3.mp3" data-start="2.48" data-duration="0.37" data-track-index="12" data-volume="0.7"></audio>
      <audio id="a-s3" src="./_shared/sfx/streak-3.mp3" data-start="2.66" data-duration="0.37" data-track-index="13" data-volume="0.7"></audio>
      <audio id="a-st1" src="./_shared/sfx/star.mp3" data-start="3.4" data-duration="0.12" data-track-index="14" data-volume="0.9"></audio>
      <audio id="a-st2" src="./_shared/sfx/star.mp3" data-start="3.75" data-duration="0.12" data-track-index="15" data-volume="0.9"></audio>
      <audio id="a-st3" src="./_shared/sfx/star.mp3" data-start="4.1" data-duration="0.12" data-track-index="16" data-volume="0.9"></audio>
    </div>
    <script>
      // Donnees (canal "full-time") : { home, away, scoreHome, scoreAway, win, goals, avgTime, bestStreak, stars }
      var DEFAULTS = {
        home: { name: "Lions", primary: "#E8212F", secondary: "#FFFFFF", initials: "LB" },
        away: { name: "Aigles", primary: "#1B6BFF", secondary: "#FFD23F", initials: "AZ" },
        scoreHome: 3, scoreAway: 2, win: true, goals: 4, avgTime: "1,9 s", bestStreak: 5, stars: 2,
      };
      var cur = DEFAULTS, ready = false;
      function merge(d) {
        d = d || {}; var o = Object.assign({}, DEFAULTS, d);
        o.home = Object.assign({}, DEFAULTS.home, d.home); o.away = Object.assign({}, DEFAULTS.away, d.away); return o;
      }
      var tl = gsap.timeline({ paused: true });
      window.__hyperframes.registerRuntimeDataHandler("full-time", function (d) { cur = merge(d); if (ready) build(); });
      // "Animations douces" (reglage parent / prefers-reduced-motion), envoye par l'app sur le canal "motion"
      window.__hyperframes.registerRuntimeDataHandler("motion", function (d) { CEArt.setSoft(!!(d && d.soft)); if (ready) build(); });
      var $ = function (s) { return document.querySelector(s); };
      $("#bg").innerHTML = '<img src="./_shared/img/stadium-soft.webp" alt="" />';
      var STAR = '<svg viewBox="-50 -50 100 100"><path d="M0 -44 L13 -14 L45 -11 L21 10 L28 42 L0 25 L-28 42 L-21 10 L-45 -11 L-13 -14Z" fill="FILL" stroke="STROKE" stroke-width="7" stroke-linejoin="round"/></svg>';
      var verdict; // {txt, bg}
      function render() {
        var s = cur, h = s.home, a = s.away;
        $("#crestH").innerHTML = CEArt.crest({ primary: h.primary, secondary: h.secondary, initials: h.initials, star: false });
        $("#crestA").innerHTML = CEArt.crest({ primary: a.primary, secondary: a.secondary, initials: a.initials, star: false });
        $("#nameH").textContent = h.name; $("#nameA").textContent = a.name;
        $("#panelbar").style.background = "linear-gradient(90deg," + h.primary + " 0 50%," + a.primary + " 50% 100%)";
        var homeWins = s.scoreHome > s.scoreAway, awayWins = s.scoreAway > s.scoreHome;
        $("#sH").style.color = homeWins ? "#ffd23f" : "#fff"; $("#sA").style.color = awayWins ? "#ffd23f" : "#fff";
        var draw = s.scoreHome === s.scoreAway;
        verdict = s.win ? { t: "VICTOIRE !", bg: "#ffd23f" } : draw ? { t: "MATCH NUL", bg: "#35d6ff" } : { t: "BEAU MATCH !", bg: "#ff8a1f" };
        $("#verdicttxt").textContent = verdict.t; $("#verdicttxt").style.fontSize = verdict.t.length > 11 ? "90px" : "104px"; $("#verdictbg").style.background = verdict.bg;
        $("#ring").style.borderColor = verdict.bg;
        $("#t0 .tv").textContent = String(s.goals); $("#t1 .tv").textContent = s.avgTime; $("#t2 .tv").textContent = String(s.bestStreak);
        $("#stars").innerHTML = [0, 1, 2].map(function (i) {
          var on = i < Math.max(0, Math.min(3, s.stars));
          return '<div class="star" id="star' + i + '" style="left:' + (i * 202) + 'px" data-on="' + (on ? 1 : 0) + '">' + STAR.replace("FILL", on ? "#FFD23F" : "rgba(255,255,255,0.08)").replace("STROKE", on ? "#B07A00" : "#7f8ccf") + "</div>";
        }).join("");
        document.querySelectorAll("#panel *").forEach(function (n) { n.setAttribute("data-layout-allow-occlusion", ""); });
        $("#player").innerHTML = CEArt.player({ primary: h.primary, secondary: h.secondary, kit: "rayures", hair: "pique", skin: 2, hairColor: 3, number: 10, pose: "idle" });
      }
      function num(t) { var n = parseFloat(String(t).replace(",", ".")); return isNaN(n) ? 0 : n; }

      function build() {
        tl.clear();
        gsap.set(["#cam", "#bg", "#banner", "#panel", "#verdict", "#ring", ".tile", "#player", "#fade", "#sH", "#sA", ".tv"], { clearProps: "all" });
        render();
        var s = cur, svg = $("#player svg"), win = !!s.win, draw = s.scoreHome === s.scoreAway;
        CEArt.setPose(gsap, svg, "idle");

        tl.to("#cam", { scale: 1.05, duration: 6, ease: "none" }, 0);
        tl.fromTo("#banner", { y: -200, opacity: 1 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0);

        // tableau
        tl.fromTo("#panel", { y: 700, opacity: 1 }, { y: 0, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.4);
        tl.fromTo("#crestH", { x: -500 }, { x: 0, duration: 0.5, ease: "expo.out" }, 0.55);
        tl.fromTo("#crestA", { x: 500 }, { x: 0, duration: 0.5, ease: "expo.out" }, 0.63);
        tl.fromTo("#player", { x: -500, opacity: 1 }, { x: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.5);
        CEArt.idleCycle(gsap, tl, svg, 1.2, 0.7);

        // scores
        CEArt.countUp(gsap, tl, $("#sH"), 0, s.scoreHome, 1.0, 0.45, null, "power2.out");
        CEArt.countUp(gsap, tl, $("#sA"), 0, s.scoreAway, 1.3, 0.45, null, "power2.out");
        tl.fromTo("#sH", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.35, duration: 0.12, ease: "power2.out" }, 1.4);
        tl.to("#sH", { scale: 1, duration: 0.35, ease: "back.out(4)" }, 1.52);
        tl.fromTo("#sA", { scale: 1, transformOrigin: "50% 60%" }, { scale: 1.35, duration: 0.12, ease: "power2.out" }, 1.7);
        tl.to("#sA", { scale: 1, duration: 0.35, ease: "back.out(4)" }, 1.82);

        // verdict
        tl.fromTo("#verdict", { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "expo.out" }, 1.9);
        tl.set("#ring", { scale: 0.3, opacity: 1 }, 1.9);
        tl.to("#ring", { scale: 3.2, opacity: 0, duration: 0.5, ease: "expo.out" }, 1.9);
        CEArt.shake(gsap, tl, "#panel", 1.92, 12, 0.3);
        $("#confetti").innerHTML = "";
        if (win) {
          CEArt.confetti(gsap, tl, $("#confetti"), { at: 1.95, count: 70, x: 860, y: 640, power: 1000, spread: 70, gravity: 1600, duration: 2.2, seed: 35, colors: [s.home.primary, s.home.secondary, "#FFD23F", "#FFFFFF", "#35D6FF"] });
          CEArt.toPose(gsap, tl, svg, "celebration", 1.9, 0.3, "back.out(1.6)");
          tl.to("#player", { y: -70, duration: 0.25, ease: "power2.out" }, 2.25);
          tl.to("#player", { y: 0, duration: 0.25, ease: "power2.in" }, 2.5);
          tl.to("#player", { y: -50, duration: 0.22, ease: "power2.out" }, 3.2);
          tl.to("#player", { y: 0, duration: 0.22, ease: "power2.in" }, 3.43);
          tl.to("#player", { y: -50, duration: 0.22, ease: "power2.out" }, 4.3);
          tl.to("#player", { y: 0, duration: 0.22, ease: "power2.in" }, 4.52);
        } else if (draw) {
          CEArt.toPose(gsap, tl, svg, "idle", 1.9, 0.3);
        } else {
          CEArt.toPose(gsap, tl, svg, "decu", 1.9, 0.5, "power2.out");
          CEArt.toPose(gsap, tl, svg, "idle", 4.6, 0.5, "power2.inOut");
        }

        // tuiles + compteurs
        [0, 1, 2].forEach(function (i) {
          var t = 2.3 + i * 0.18;
          tl.fromTo("#t" + i, { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.4)" }, t);
        });
        CEArt.countUp(gsap, tl, $("#t0 .tv"), 0, s.goals, 2.4, 0.6, null, "power2.out");
        CEArt.countUp(gsap, tl, $("#t1 .tv"), 0, num(s.avgTime), 2.58, 0.6, function (v) { return v.toFixed(1).replace(".", ",") + " s"; }, "power2.out");
        CEArt.countUp(gsap, tl, $("#t2 .tv"), 0, s.bestStreak, 2.76, 0.6, null, "power2.out");

        // etoiles
        [0, 1, 2].forEach(function (i) {
          var on = i < Math.max(0, Math.min(3, s.stars)), t = 3.4 + i * 0.35;
          if (on) {
            tl.fromTo("#star" + i, { scale: 0, rotation: -30, opacity: 1 }, { scale: 1.35, rotation: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, t);
            tl.to("#star" + i, { scale: 1, duration: 0.3, ease: "back.out(3)" }, t + 0.25);
          } else {
            tl.fromTo("#star" + i, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 0.75, duration: 0.35, ease: "power2.out" }, t);
          }
        });

        tl.to("#panel", { scale: 0.97, duration: 0.5, ease: "power1.in" }, 5.5);
        tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.in" }, 5.65);
        tl.time(0);
      }
      build();
      ready = true;
      window.__timelines["full-time"] = tl;
    </script>
  </body>
</html>
