<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1200" />
    <title>But !</title>
    <!-- Runtime HyperFrames, GSAP et kit CEArt servis en local (hors-ligne). Ordre important : runtime d'abord. -->
    <script src="./_shared/hyperframe.runtime.iife.js"></script>
    <script src="./_shared/gsap.min.js"></script>
    <script src="./_shared/ceart.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("./_shared/Anton-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Fredoka"; src: url("./_shared/Fredoka-latin.woff2") format("woff2"); font-weight: 300 700; }
      html, body { margin: 0; background: #070c2b; }
      #root, #root * { pointer-events: none; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070c2b; }
      .abs { position: absolute; left: 0; top: 0; }
      #cam { position: absolute; inset: 0; transform-origin: 960px 696px; will-change: transform; }
      #cam svg { display: block; }
      #goalwrap { position: absolute; left: 700px; top: 440px; width: 520px; }
      #goalwrap svg { width: 100%; height: auto; }
      #shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(7, 12, 43, 0) 35%, rgba(7, 12, 43, 0.72) 100%); }
      #rays { position: absolute; left: 960px; top: 560px; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; opacity: 0; will-change: transform, opacity; }
      #rays svg { width: 100%; height: 100%; }
      #ball { position: absolute; left: 0; top: 0; width: 220px; height: 220px; margin: -110px 0 0 -110px; opacity: 0; }
      #ball svg { width: 100%; height: 100%; }
      #tail { position: absolute; left: 0; top: 0; width: 760px; height: 86px; margin: -43px 0 0 -760px; border-radius: 43px; opacity: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,244,190,0.85)); transform-origin: 100% 50%; }
      #ring { position: absolute; left: 960px; top: 604px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 18px solid #ffd23f; box-sizing: border-box; opacity: 0; }
      #flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #fff6d6 0%, rgba(255, 246, 214, 0.45) 40%, rgba(255, 246, 214, 0) 72%); opacity: 0; }
      #confetti { position: absolute; inset: 0; }
      #word { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-family: "Anton", sans-serif; font-size: 470px; line-height: 0.95; letter-spacing: 6px; color: #fff;
        -webkit-text-stroke: 12px #0a1030; paint-order: stroke fill; opacity: 0; white-space: nowrap;
        text-shadow: 0 14px 0 #ff4d6d, 0 28px 0 #b01a3c, 0 42px 0 #6e0f26, 0 70px 90px rgba(0, 0, 0, 0.6); }
      #sbwrap { position: absolute; left: 550px; top: 60px; width: 820px; opacity: 0; }
      #sbwrap svg, #ltwrap svg { width: 100%; height: auto; display: block; }
      #ltwrap { position: absolute; left: 96px; top: 872px; width: 1100px; opacity: 0; }
      #ltmask { overflow: visible; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="goal" data-start="0" data-width="1920" data-height="1200" data-duration="2.5">
      <div id="cam">
        <div id="stadium" class="abs" style="inset: 0" data-layout-ignore></div>
        <div id="goalwrap" data-layout-ignore></div>
        <div id="shade"></div>
      </div>
      <div id="rays" data-layout-ignore></div>
      <div id="tail"></div>
      <div id="ball"></div>
      <div id="ring"></div>
      <div id="flash"></div>
      <div id="confetti" data-layout-ignore></div>
      <div id="word" data-layout-allow-overflow>BUT&nbsp;!</div>
      <div id="sbwrap" data-layout-allow-overflow></div>
      <div id="ltwrap" data-layout-allow-overflow></div>

      <audio id="a-kick" src="./_shared/sfx/kick.mp3" data-start="0" data-duration="1.4" data-track-index="1" data-volume="0.9"></audio>
      <audio id="a-net" src="./_shared/sfx/ball-net.mp3" data-start="0.52" data-duration="0.82" data-track-index="2" data-volume="1"></audio>
      <audio id="a-roar" src="./_shared/sfx/roar-goal.mp3" data-start="0.5" data-duration="2" data-track-index="3" data-volume="0.8"></audio>
      <audio id="a-swoosh" src="./_shared/sfx/swoosh-in.mp3" data-start="1.0" data-duration="0.2" data-track-index="4" data-volume="0.7"></audio>
      <audio id="a-combo" src="./_shared/sfx/combo.mp3" data-start="1.25" data-duration="0.35" data-track-index="5" data-volume="0.7"></audio>
      <audio id="a-star" src="./_shared/sfx/star.mp3" data-start="1.3" data-duration="0.12" data-track-index="6" data-volume="0.8"></audio>
    </div>
    <script>
      // ---------- donnees (canal "goal") : { name, calc, time, scoreHome, scoreAway, home?, away? }
      var DEFAULTS = {
        name: "Léo", calc: "7 + 8 = 15", time: "1,8 s", scoreHome: 1, scoreAway: 0,
        home: { name: "Lions", primary: "#E8212F", secondary: "#FFFFFF", initials: "LB" },
        away: { name: "Aigles", primary: "#1B6BFF", secondary: "#FFD23F", initials: "AZ" },
      };
      var cur = DEFAULTS, ready = false;
      function merge(d) {
        var o = Object.assign({}, DEFAULTS, d || {});
        o.home = Object.assign({}, DEFAULTS.home, (d || {}).home); o.away = Object.assign({}, DEFAULTS.away, (d || {}).away);
        return o;
      }
      var tl = gsap.timeline({ paused: true });
      window.__hyperframes.registerRuntimeDataHandler("goal", function (d) { cur = merge(d); if (ready) build(); });
      // "Animations douces" (reglage parent / prefers-reduced-motion), envoye par l'app sur le canal "motion"
      window.__hyperframes.registerRuntimeDataHandler("motion", function (d) { CEArt.setSoft(!!(d && d.soft)); if (ready) build(); });

      var $ = function (s) { return document.querySelector(s); };
      // éléments statiques (jamais re-rendus)
      // stade rasterise (WebP) + 8 emplacements de flashs (politique "mouvement sur")
      $("#stadium").innerHTML = CEArt.stadium({ raster: "./_shared/img/", flashes: 8, lights: "img" });
      $("#goalwrap").innerHTML = CEArt.goal();
      $("#rays").innerHTML = CEArt.rays({ count: 16, color: "#ffd23f", opacity: 0.9, size: 2400 });
      $("#ball").innerHTML = CEArt.ball();

      function render() {
        var s = cur;
        $("#sbwrap").innerHTML = CEArt.scoreBug({ home: s.home, away: s.away, scoreHome: Math.max(0, s.scoreHome - 1), scoreAway: s.scoreAway, clock: "" });
        $("#ltwrap").innerHTML = CEArt.lowerThird({ title: s.name, subtitle: s.calc + "   ·   " + s.time, badge: null, primary: s.home.primary });
      }

      function build() {
        tl.clear();
        render();
        var s = cur;
        var cam = $("#cam"), stad = $("#stadium");
        var back = $(".goal-back"), flashes = stad;
        // état initial
        gsap.set(["#word", "#flash", "#ring", "#ball", "#tail", "#rays", "#sbwrap", "#ltwrap"], { clearProps: "transform,opacity" });

        // --- 0.00 - 0.55 : push-in + tir
        tl.fromTo(cam, { scale: 1 }, { scale: 1.14, duration: 0.55, ease: "power2.in" }, 0);
        tl.fromTo("#ball", { x: 380, y: 1010, scale: 1, rotation: 0, opacity: 1 }, { x: 960, opacity: 1, duration: 0.55, ease: "power1.out" }, 0);
        tl.fromTo("#ball", { y: 1010 }, { y: 520, duration: 0.36, ease: "power2.out", immediateRender: false }, 0);
        tl.to("#ball", { y: 606, duration: 0.19, ease: "power1.in" }, 0.36);
        tl.fromTo("#ball", { scale: 1 }, { scale: 0.28, duration: 0.55, ease: "power1.out", immediateRender: false }, 0);
        tl.fromTo("#ball", { rotation: 0 }, { rotation: 900, duration: 0.55, ease: "none", immediateRender: false }, 0);
        tl.fromTo("#tail", { x: 380, y: 1010, rotation: -34, scaleX: 1, opacity: 0.9 }, { x: 960, opacity: 0.9, duration: 0.55, ease: "power1.out" }, 0);
        tl.fromTo("#tail", { y: 1010 }, { y: 520, duration: 0.36, ease: "power2.out", immediateRender: false }, 0);
        tl.to("#tail", { y: 606, duration: 0.19, ease: "power1.in" }, 0.36);
        tl.to("#tail", { scaleX: 0.25, duration: 0.55, ease: "power1.in" }, 0);
        tl.to("#tail", { opacity: 0, duration: 0.1, ease: "power1.out" }, 0.55);
        tl.to("#ball", { opacity: 0, duration: 0.1, ease: "power1.out" }, 0.55);

        // --- 0.55 : impact
        // bloom chaud et doux (<= 0,22, montee 0,3 s) a la place du flash blanc plein ecran
        CEArt.bloom(gsap, tl, "#flash", 0.41, 0.22, 0.3);
        tl.fromTo(back, { scale: 1, svgOrigin: "450 300" }, { scale: 1.12, svgOrigin: "450 300", duration: 0.12, ease: "power2.out" }, 0.55);
        tl.to(back, { scale: 1, svgOrigin: "450 300", duration: 0.5, ease: "elastic.out(1,0.4)" }, 0.67);
        CEArt.shake(gsap, tl, "#cam", 0.56, 18, 0.4);
        tl.set("#ring", { scale: 0.2, opacity: 1 }, 0.55);
        tl.to("#ring", { scale: 3.4, opacity: 0, duration: 0.55, ease: "expo.out" }, 0.55);
        tl.fromTo("#rays", { opacity: 0, rotation: 0 }, { opacity: 0.22, duration: 0.35, ease: "sine.out" }, 0.55);
        tl.to("#rays", { rotation: 16, duration: 2.0, ease: "none" }, 0.55);
        CEArt.crowdFlashes(gsap, tl, stad, 0.6, 1.0, 1, 21);

        // --- 0.55 - 0.95 : BUT !
        // "BUT !" claque par le mouvement (echelle) mais apparait en fondu de 0,3 s : pas d'eclair blanc
        tl.set("#word", { opacity: 0, scale: 3.2, rotation: -9, y: 0 }, 0);
        tl.to("#word", { scale: 1, rotation: -3, duration: 0.38, ease: "expo.out" }, 0.55);
        tl.to("#word", { opacity: 1, duration: 0.3, ease: "sine.out" }, 0.55);
        tl.fromTo("#word", { scale: 1 }, { scale: 1.06, duration: 0.09, ease: "power1.out", immediateRender: false }, 0.93);
        tl.to("#word", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 1.02);
        $("#confetti").innerHTML = "";
        CEArt.confetti(gsap, tl, $("#confetti"), { at: 0.58, count: 90, x: 960, y: 620, power: 1050, spread: 70, gravity: 1700, duration: 2.0, seed: 8 });
        tl.to("#word", { y: -16, duration: 0.5, ease: "sine.inOut" }, 1.5);

        // --- 0.90 - 1.30 : score bug
        tl.fromTo("#sbwrap", { y: -240, opacity: 1 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 0.9);
        var home = $("#sbwrap .sb-home");
        var o = { v: Math.max(0, s.scoreHome - 1) };
        tl.fromTo(o, { v: Math.max(0, s.scoreHome - 1) }, { v: s.scoreHome, duration: 0.05, ease: "none", onUpdate: function () { home.textContent = String(Math.round(o.v)); } }, 1.25);
        tl.fromTo(home, { scale: 1, svgOrigin: "468 66" }, { scale: 1.5, svgOrigin: "468 66", duration: 0.1, ease: "power2.out" }, 1.25);
        tl.to(home, { scale: 1, svgOrigin: "468 66", duration: 0.35, ease: "back.out(4)" }, 1.35);

        // --- 1.00 - 1.55 : lower-third
        tl.fromTo("#ltwrap", { x: -1300, opacity: 1 }, { x: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, 1.0);
        tl.fromTo("#ltwrap .lt-sub", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power2.out" }, 1.28);

        // --- 1.55 - 2.50 : maintien + sortie
        tl.to(cam, { scale: 1.18, duration: 0.95, ease: "sine.inOut" }, 1.55);
        tl.to("#word", { opacity: 0, y: -90, duration: 0.3, ease: "power2.in" }, 2.15);
        tl.to("#ltwrap", { x: -1300, duration: 0.3, ease: "power3.in" }, 2.15);
        tl.to("#sbwrap", { y: -240, duration: 0.3, ease: "power3.in" }, 2.15);
        tl.to("#rays", { opacity: 0, duration: 0.3 }, 2.15);
        tl.time(0);
      }
      build();
      ready = true;
      window.__timelines["goal"] = tl;
    </script>
  </body>
</html>
